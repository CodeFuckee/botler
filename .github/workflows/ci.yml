# ================================================================
# Botler GitHub Actions CI（GitLab CI 的 GitHub 镜像版，issue #10）
#
# 参考 .gitlab-ci.yml 的 job 拓扑，剔除部署阶段（GitHub 仓库是
# 公开展示镜像，不做部署；部署仍由 GitLab 流水线负责）：
#
#   bandit-scan ──► frontend-build（npm ci → npm test → vite build → 产物验证）
#             └──► backend-test   （uv 装依赖 → pytest）
#
# bandit-scan 为安全门禁（issue #58）：中/高危漏洞时 job 失败，通过
# needs 依赖使 frontend-build / backend-test 跳过，整体 workflow 失败
# 阻断（与 GitLab security stage 语义一致）。
#
# 触发方式：
#   - push（main）：主入口。镜像同步 commit 不含跳过标记（见
#     .gitlab-ci.yml sync_to_github），GitHub 会在每次镜像同步后
#     自动运行本工作流
#   - workflow_dispatch：手动补充入口（GitHub 网页 Run workflow；
#     GitLab sync_to_github 也会调用 API 补充触发一次，需要 token
#     含 workflow scope，失败仅警告，不影响 push 触发）
#
# 与 GitLab 的差异说明：
#   - runner 为 GitHub 托管环境（ubuntu-latest），海外网络：npm 用
#     官方 registry、pip 用 pypi.org（GitLab runner 在国内用
#     npmmirror / 清华镜像）
#   - 版本号自增（gen-version.mjs）仅写入 runner 临时数据目录
#     （未设置 BOTLER_DATA_DIR 时回退 ../data/，位于 runner workspace
#     外，每次 job 都是干净环境），不影响 GitLab 侧的持久版本号
#     （data/version.txt）
# ================================================================

name: CI

on:
  push:
    branches: [main]
    # issue #57：docs-only 提交（仅 *.md / docs/ / LICENSE 变更）不触发
    # CI。paths 为白名单语义：至少一个变更文件匹配才运行本工作流，
    # 纯文档 push 无匹配 → 不运行；docs+代码混合 push → 代码文件匹配 →
    # 照常运行。与 GitLab 侧 .docs_only_skip 规则（.gitlab-ci.yml）
    # 使用同一套「代码文件」定义，保持两边判定一致。
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.gitignore'
      - '**/*.py'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.html'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.toml'
      - '**/*.sh'
  workflow_dispatch:

jobs:
  # ================================================================
  # 安全：bandit 静态扫描（与 GitLab security:bandit 对应，issue #58）
  # 存在高危/中危（--severity-level medium）漏洞时 bandit 退出码非 0，
  # 本 job 失败；frontend-build / backend-test 通过 needs 依赖本 job，
  # 失败时两者跳过，整体 workflow 失败（阻断语义）。低危仅记录不阻断。
  # 误报处理与 GitLab 侧一致（database.py 4 处 # nosec B608，列名
  # 来自模块级常量白名单）。
  # ================================================================
  bandit-scan:
    name: 后端 bandit 安全扫描（中/高危阻断）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # 与 backend-test 一致（部署环境 Python 3.11）
          python-version: "3.11"
          enable-cache: true

      - name: bandit 安全扫描（severity ≥ medium 即失败）
        run: |
          cd backend
          uv venv .venv
          # --python 显式指定本 job 的 venv（同 backend-test 说明：setup-uv
          # 的 python-version 参数会激活 workspace/.venv，不显式指定会装错环境）
          uv pip install --python .venv/bin/python bandit
          .venv/bin/python -m bandit -r botler --severity-level medium
          echo "✓ 未发现高危/中危漏洞（低危漏洞仅记录不阻断）"

  # ================================================================
  # 前端：React/Vite 构建与测试（与 GitLab frontend:build 对应）
  # ================================================================
  frontend-build:
    name: 前端 React/Vite 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 安全门禁（issue #58）：bandit-scan 失败时本 job 跳过
    needs: bandit-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 GitLab runner 实际版本一致（v22：node --test 的 glob
          # 参数需 Node 21+，npm test 脚本依赖此特性）；Dockerfile 的
          # node:20 为部署运行时，与此无关
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci）
        run: |
          cd frontend
          npm ci

      - name: 前端测试 + 覆盖率（node --test + c8，issue #210）
        run: |
          cd frontend
          npm run test:coverage

      - name: 上传前端覆盖率报告（Cobertura）
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cobertura-coverage
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: 构建前端（vite build，含版本自增 gen-version.mjs）
        run: |
          cd frontend
          npm run build

      - name: 验证构建产物
        run: |
          cd frontend
          ls -la dist/index.html
          echo "--- dist/version.json（版本号 + 构建时间）---"
          cat dist/version.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ================================================================
  # 后端：Python 单元测试（与 GitLab backend:test 对应，uv 安装依赖）
  # ================================================================
  backend-test:
    name: 后端 Python 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 安全门禁（issue #58）：bandit-scan 失败时本 job 跳过
    needs: bandit-scan
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # 与部署环境（node:20-bookworm-slim 自带 Python 3.11）一致
          python-version: "3.11"
          enable-cache: true

      - name: 运行 pytest
        run: |
          cd backend
          uv venv .venv
          # --python 显式指定本 job 的 venv：setup-uv 的 python-version 参数
          # 会激活 workspace/.venv（VIRTUAL_ENV），uv pip install 默认装到
          # 激活环境，导致 backend/.venv 为空（GitLab shell executor 无此行为）
          uv pip install --python .venv/bin/python -r requirements.txt
          # 覆盖率门禁（issue #210）：总覆盖率低于 70% 阻断；xml 供上传
          .venv/bin/python -m pytest tests/ -v --tb=short --cov=botler --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: 上传后端覆盖率报告（Cobertura）
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: error
