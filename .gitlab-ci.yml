# ================================================================
# Botler 统一 CI/CD 流水线
#
# 涵盖前端 (React/Vite) 和后端 (Python FastAPI) 的构建、测试和
# 部署任务（参考 Shipyard 项目的 CI 模式）。前端构建与后端测试
# 并行执行，部署阶段等待前端构建产物通过后才触发。
#
# Stage 拓扑（依赖关系）：
#
#   build（并行）                    deploy
#   ┌──────────────────────┐
#   │ frontend:build ────────────► deploy_to_code01
#   │   (React/Vite 构建)   │      (Docker 部署 + 健康检查)
#   └──────────────────────┘
#
# 说明：
#   - 第一阶段 build：frontend:build（npm 构建前端，构建预检）与
#     backend:test（uv 安装依赖 + pytest/语法检查）并行执行
#   - 第二阶段 deploy：frontend:build 通过后部署到本机
#     （code01 = 10.0.0.122，shell executor，docker compose 管理容器）
#
# 部署模型（Docker 部署，issue #7 起替代原 pm2 模式）：
#   - 部署目标就是 gitlab-runner 所在机器（10.0.0.122），shell executor
#     工作目录跨 job 持久化：backend/.env、backend/config.yaml、botler.db、
#     workspace/、logs/ 等运行时文件天然保留，作为 compose 挂载数据目录
#     （BOTLER_DATA_DIR 默认 "."）
#   - 前端已打进镜像（Dockerfile 多阶段构建，FastAPI 直接托管），
#     deploy 不再下载 frontend:build 的 dist 产物
#   - 容器内 git 操作（执行器 clone/push）凭据：宿主 ~/.git-credentials
#     或 GITLAB_BOT_TOKEN 生成，挂载为容器 /root/.git-credentials
#   - 凭据（backend/.env、.git-credentials，gitignore 排除）不入库、不进日志
# ================================================================

stages:
  - build
  - deploy
  - sync

# ================================================================
# 全局变量
# ================================================================
variables:
  # shell executor 工作目录跨 job 持久化，GIT_CLEAN_FLAGS: none 防止
  # clean 掉运行时文件（.env / config.yaml / .venv 等）
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 镜像 / 注册表地址（国内源，可在 GitLab UI 中覆盖）
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  NPM_REGISTRY_URL: "https://registry.npmmirror.com"

  # ----------------------------------------------------------
  # 部署变量
  # ----------------------------------------------------------
  APP_NAME: "botler"
  DEPLOY_PORT: "8000"
  # 部署后健康检查重试次数（×2 秒 ≈ 90 秒；Docker 容器启动较 pm2 慢）
  HEALTHCHECK_RETRIES: "45"

# ================================================================
# 公共配置
# ================================================================

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      # node/npm 在 $HOME/.local/bin（shell executor 的 PATH 可能不含）
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Node 版本: $(node --version 2>/dev/null || echo '未安装')"
      echo "npm 版本: $(npm --version 2>/dev/null || echo '未安装')"
      echo "npm registry: $NPM_REGISTRY_URL"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "uv 版本: $(uv --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: build —— 第一阶段：前端构建 + 后端测试（并行）
# ================================================================

# --- 前端：React/Vite 构建（构建预检；产物供排查，部署走镜像内构建）---
frontend:build:
  extends: .frontend_setup
  stage: build
  tags:
    - linux
    - code01
  timeout: 20m
  script:
    - JOB_START_TIME=$(date +%s)
    - echo "=== 1. 安装依赖（npm ci）==="
    - npm ci --registry=${NPM_REGISTRY_URL}
    - echo "=== 2. 构建前端（vite build）==="
    - npm run build
    - echo "=== 3. 验证构建产物 ==="
    - ls -la dist/index.html
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 day

# --- 后端：Python 测试（uv 高速包管理）---
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，与 Shipyard 的 backend:test 同模式。
backend:test:
  extends: .backend_setup
  stage: build
  tags:
    - linux
    - code01
  timeout: 30m
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      echo "uv: $(uv --version)"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (确保 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建/复用虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，.venv 复用；全新环境才创建
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖 ==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行测试 ==="
      if [ -d tests ]; then
        $PYTHON -m pytest tests/ -v --tb=short
      else
        echo "⚠️  未发现 tests/ 目录，执行语法与导入冒烟检查"
        $PYTHON -m compileall botler -q && echo "✓ 语法检查通过"
        # ⚠️ 不 import botler.main：模块级 create_app() 会加载 config.yaml，
        #    凭据环境变量（GITLAB_BOT_TOKEN 等）在 CI 中未设置会导致
        #    ValueError。仅导入无副作用的顶层包。
        $PYTHON -c "import botler; print('✓ botler 包导入成功 (v' + botler.__version__ + ')')"
      fi
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行测试) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (确保 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (虚拟环境):         $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装依赖):         $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行测试):         $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="

# ================================================================
# Stage: deploy —— 第二阶段：本机 Docker 部署（docker compose + 健康检查）
# 在 gitlab-runner 机器（code01 = 10.0.0.122）上构建镜像并起容器：
# 前端/后端/全部依赖打进镜像（Dockerfile 多阶段构建），配置与数据
# 卷挂载自 runner 工作目录（跨 job 持久化）。原 pm2 模式退役，
# 部署前自动停止旧 pm2 服务避免端口冲突（pm2 仍保留为手动备选）。
# ================================================================
deploy_to_code01:
  stage: deploy
  tags:
    - linux
    - code01
  timeout: 30m
  # 第二阶段门禁：frontend:build 通过后才部署（镜像自含前端构建，
  # 不下载 dist 产物；frontend:build 起构建预检作用）
  needs:
    - job: frontend:build
  before_script:
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "当前用户: $(whoami)"
      echo "Docker 版本: $(docker --version 2>/dev/null || echo '未安装')"
      echo "Compose 版本: $(docker compose version --short 2>/dev/null || echo '未安装')"
      # code01 存在全局代理环境变量（干扰外网直连），docker build 需
      # 访问 Docker Hub 拉基础镜像，先清理代理（与 sync_to_github 一致）
      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"
  script:
    - |
      JOB_START_TIME=$(date +%s)
      # 调试进度日志（部署排查用，job 目录可直接读取）
      DBG_LOG="$CI_PROJECT_DIR/deploy_progress.log"
      dbg() { echo "$(date '+%H:%M:%S') [$1] $2" >> "$DBG_LOG"; }
      # ⚠️ 只输出注入状态标记，绝不输出变量值（避免凭据落盘）
      GBT=$([ -n "${GITLAB_BOT_TOKEN:-}" ] && echo 已注入 || echo 未注入)
      WHS=$([ -n "${WEBHOOK_SECRET:-}" ] && echo 已注入 || echo 未注入)
      dbg START "CI_PROJECT_DIR=$CI_PROJECT_DIR 凭据注入状态: GITLAB_BOT_TOKEN=$GBT WEBHOOK_SECRET=$WHS"

      # ================================================================
      # 第 1 步：检查 docker / docker compose 可用
      # ⚠️ code01 的 docker 默认 context 为 rootless，容器运行有已知故障
      # （shim 启动报 unsupported protocol: unix，TTRPC 连接失败），
      # 强制使用 rootful socket（/var/run/docker.sock）部署
      # ================================================================
      dbg STEP1 "检查 docker 可用性"
      echo "=== 1. 检查 Docker ==="
      export DOCKER_HOST="${DOCKER_HOST:-unix:///var/run/docker.sock}"
      command -v docker >/dev/null 2>&1 || { dbg STEP1 "FAIL: docker 不可用"; echo "❌ docker 不可用：Docker 部署需要 code01 安装 Docker 20.10+"; exit 1; }
      docker compose version >/dev/null 2>&1 || { dbg STEP1 "FAIL: docker compose 不可用"; echo "❌ docker compose 不可用（需 compose v2）"; exit 1; }
      docker info >/dev/null 2>&1 || { dbg STEP1 "FAIL: docker daemon 不可达（rootful socket）"; echo "❌ docker daemon 不可达：${DOCKER_HOST}"; echo "   rootless context 有容器运行故障，需 rootful daemon 可用（runner 用户需 docker 组权限）"; exit 1; }
      echo "✓ docker: $(docker --version) / compose: $(docker compose version --short) / daemon: $(docker info --format '{{.ServerVersion}}')"
      dbg STEP1 "OK"

      # ================================================================
      # 第 2 步：准备运行时凭据 backend/.env（凭据不入库）
      # 已存在则保留（服务器手动维护的配置优先）；缺失时用 CI 变量
      # 生成。容器经卷挂载读取（compose 挂载 :ro），后端 load_dotenv
      # 加载 GITLAB_BOT_TOKEN / WEBHOOK_SECRET / ANTHROPIC_* 等。
      # ================================================================
      dbg STEP2 "准备 backend/.env"
      echo "=== 2. 准备 backend/.env ==="
      if [ ! -f backend/.env ]; then
        dbg STEP2 "backend/.env 不存在，尝试用 CI 变量生成"
        if [ -z "${GITLAB_BOT_TOKEN:-}" ] && [ -z "${WEBHOOK_SECRET:-}" ]; then
          dbg STEP2 "FAIL: 凭据缺失"
          echo "❌ 凭据缺失：backend/.env 不存在，且 CI 变量未提供"
          echo "   GITLAB_BOT_TOKEN / WEBHOOK_SECRET"
          echo "   配置方法（推荐）：GitLab 项目 Settings > CI/CD > Variables 添加"
          echo "     GITLAB_BOT_TOKEN — bot 账号 PAT（scope 至少 api + write_repository）"
          echo "     WEBHOOK_SECRET   — webhook 校验 secret（如 openssl rand -hex 32）"
          echo "   或首次手动部署时在 backend/ 创建 .env（参考 backend/.env.example）"
          exit 1
        fi
        : > backend/.env
        for var in GITLAB_BOT_TOKEN WEBHOOK_SECRET ANTHROPIC_API_KEY ANTHROPIC_BASE_URL ANTHROPIC_MODEL; do
          [ -n "${!var:-}" ] && echo "${var}=${!var}" >> backend/.env
        done
        chmod 600 backend/.env
        echo "✓ 已用 CI 变量生成 backend/.env（变量：$(cut -d= -f1 backend/.env | paste -sd ',' -)）"
        dbg STEP2 "OK: CI 变量生成"
      else
        echo "✓ backend/.env 已存在（保留服务器配置）"
        dbg STEP2 "OK: 已存在"
      fi
      if [ ! -f backend/config.yaml ]; then
        echo "⚠️  backend/config.yaml 不存在，用示例配置兜底"
        cp backend/config.example.yaml backend/config.yaml
      else
        echo "✓ backend/config.yaml 存在"
      fi

      # ================================================================
      # 第 3 步：准备容器内 git 凭据（执行器 clone/push 仓库依赖）
      # 容器内无 libsecret/D-Bus，宿主 credential.helper 不可用；镜像
      # 以 root 运行，凭据文件统一挂载为 /root/.git-credentials，容器内
      # 用 GIT_CONFIG 强制 store helper 读取。优先复用宿主凭据文件，
      # 否则用 GITLAB_BOT_TOKEN 生成（GitLab PAT，oauth2 用户名）。
      # ================================================================
      dbg STEP3 "准备容器 git 凭据"
      echo "=== 3. 准备容器内 git 凭据 ==="
      GIT_CRED_FILE="$CI_PROJECT_DIR/.git-credentials"
      if [ -f "$HOME/.git-credentials" ]; then
        cp "$HOME/.git-credentials" "$GIT_CRED_FILE" && chmod 600 "$GIT_CRED_FILE"
        echo "✓ 已复用宿主 git 凭据文件"
        dbg STEP3 "OK: 复用宿主 .git-credentials"
      elif [ -n "${GITLAB_BOT_TOKEN:-}" ]; then
        printf 'https://oauth2:%s@home.chenkaidi.top:509\n' "$GITLAB_BOT_TOKEN" > "$GIT_CRED_FILE"
        chmod 600 "$GIT_CRED_FILE"
        echo "✓ 已用 GITLAB_BOT_TOKEN 生成 git 凭据（仅 home.chenkaidi.top:509）"
        dbg STEP3 "OK: GITLAB_BOT_TOKEN 生成"
      else
        touch "$GIT_CRED_FILE"
        echo "⚠️  宿主无 git 凭据且无 GITLAB_BOT_TOKEN，容器内执行器 clone/push 将失败"
        dbg STEP3 "WARN: 无 git 凭据可用"
      fi
      export GIT_CREDENTIALS_FILE="$GIT_CRED_FILE"

      # ================================================================
      # 第 4 步：停止旧 pm2 服务（部署方式切换，防 8000 端口冲突）
      # pm2 / systemd 仍保留为手动部署备选，互斥运行
      # ================================================================
      dbg STEP4 "停止旧 pm2 服务"
      echo "=== 4. 停止旧 pm2 服务 ==="
      if command -v pm2 >/dev/null 2>&1 && pm2 describe ${APP_NAME} >/dev/null 2>&1; then
        pm2 delete ${APP_NAME} >/dev/null 2>&1 && echo "✓ 已停止 pm2 botler（旧部署方式）" || echo "⚠️ pm2 delete 失败（继续）"
        pm2 save >/dev/null 2>&1 || true
        dbg STEP4 "OK: pm2 已停止"
      else
        echo "✓ 无运行中的 pm2 botler（或 pm2 未安装），无需停止"
        dbg STEP4 "OK: 无需停止"
      fi

      # ================================================================
      # 第 5 步：构建镜像并启动容器（docker compose up -d --build）
      # 前端/后端/依赖全部打进镜像（Dockerfile 多阶段构建）；配置与
      # 数据挂载自工作目录（BOTLER_DATA_DIR 默认 "."），容器重建不丢
      # 数据；NODE_IMAGE / RUNTIME_IMAGE 可用 CI 变量覆盖（国内源）。
      # ⚠️ 默认官方源构建失败时（国内网络访问 Docker Hub 超时），
      # 自动改用国内镜像源 docker.m.daocloud.io 重试一次。
      # ================================================================
      dbg STEP5 "docker compose up -d --build"
      echo "=== 5. 构建镜像并启动容器 ==="
      export NODE_IMAGE="${NODE_IMAGE:-node:20-alpine}"
      export RUNTIME_IMAGE="${RUNTIME_IMAGE:-node:20-bookworm-slim}"
      if ! docker compose -p botler up -d --build >> "$DBG_LOG" 2>&1; then
        echo "⚠️  默认镜像源构建失败（可能是 Docker Hub 不可达），改用国内镜像源重试..."
        dbg STEP5 "WARN: 默认源失败，改用 docker.m.daocloud.io"
        export NODE_IMAGE=docker.m.daocloud.io/library/node:20-alpine
        export RUNTIME_IMAGE=docker.m.daocloud.io/library/node:20-bookworm-slim
        if ! docker compose -p botler up -d --build >> "$DBG_LOG" 2>&1; then
          dbg STEP5 "FAIL: docker compose up（国内源也失败）"
          echo "❌ docker compose up 失败，最近日志："
          tail -40 "$DBG_LOG"
          exit 1
        fi
        echo "✓ 国内镜像源构建成功"
      fi
      dbg STEP5 "OK: 容器已启动"
      echo "✓ 容器已启动："
      docker compose -p botler ps --format "table {{.Name}}\t{{.Status}}"

      # ================================================================
      # 第 6 步：等待服务就绪（健康检查，失败必须 exit 1 不能假绿）
      # ================================================================
      dbg STEP6 "健康检查 http://localhost:${DEPLOY_PORT}/api/health"
      echo "=== 6. 等待服务就绪（http://localhost:${DEPLOY_PORT}）==="
      HEALTHY=false
      for i in $(seq 1 ${HEALTHCHECK_RETRIES:-45}); do
        if curl -sf "http://localhost:${DEPLOY_PORT}/api/health" >/dev/null 2>&1; then
          echo "✓ 后端健康检查通过 ($((i * 2))s)"
          dbg STEP6 "OK: 健康检查通过 ($((i * 2))s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... ($((i * 2))s)"
        sleep 2
      done
      if [ "$HEALTHY" = false ]; then
        dbg STEP6 "FAIL: 健康检查 ${HEALTHCHECK_RETRIES:-45} 次全部失败"
        dbg STEP6 "容器状态: $(docker compose -p botler ps --format '{{.Status}}' 2>/dev/null | tr '\n' ' ')"
      fi

      # ================================================================
      # 第 7 步：验证部署结果（后端健康 + 前端页面可达）
      # ================================================================
      echo "=== 7. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "--- 后端健康检查 ---"
        curl -sf "http://localhost:${DEPLOY_PORT}/api/health" && echo "" && echo "✓ /api/health OK"
        echo "--- 前端页面检查 ---"
        if curl -sf "http://localhost:${DEPLOY_PORT}/" | grep -q '<div id="root">'; then
          echo "✓ 前端页面可达（镜像内 dist 渲染）"
        else
          echo "⚠️  前端页面未返回预期内容（镜像内 dist 可能异常，检查容器日志）"
        fi
        echo ""
        echo "=== docker compose 状态 ==="
        docker compose -p botler ps
        echo ""
        echo "✓ 部署成功！应用运行在 http://10.0.0.122:${DEPLOY_PORT}（Docker 容器 botler）"
      else
        echo "错误：服务健康检查未通过（${DEPLOY_PORT} 端口无响应）"
        echo ""
        echo "=== 容器状态 ==="
        docker compose -p botler ps 2>/dev/null || echo "  （容器未找到）"
        echo ""
        echo "=== 容器日志（尾部 80 行）==="
        docker compose -p botler logs --tail 80 2>/dev/null || true
        echo ""
        echo "错误：部署验证失败，Job 标记为失败"
        exit 1
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_code01] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# ================================================================
# Stage: sync —— GitHub 镜像同步（剔除 .gitlab-ci.yml + 内部信息脱敏）
# 在每次 main 分支 push 的流水线全部成功后，把本次提交镜像到
# GitHub（CodeFuckee/botler，公开展示用；参考 Shipyard 的
# sync_to_github，同账号同模式）。GitHub 仓库不需要 GitLab 专有
# CI 配置，同步时剔除 .gitlab-ci.yml；同时对所有包含内部地址的
# 文件做脱敏（自建 GitLab 域名、内网服务器 IP 替换为 RFC 2606
# 示例占位符），合并为一个 commit 后 force push，镜像历史由本
# job 全权维护。
#
# 脱敏规则（同步前对工作区文本文件全局替换，.gitlab-ci.yml 已
# 剔除、不进 GitHub）：
#   home.chenkaidi.top:509  →  gitlab.example.com
#   10.0.0.122              →  your-server.example.com
# 文件按内容动态扫描，未来新增含内部地址的文件也会被覆盖。
#
# 前提：GitLab CI/CD 变量 GITHUB_PUSH_TOKEN（GitHub PAT，需对
#       botler 仓库有写权限，建议勾选 Masked + Protected）。
#       未配置时本 job 跳过（exit 0），不影响主流水线。
# ================================================================
sync_to_github:
  stage: sync
  tags:
    - linux
    - code01
  variables:
    # 本 job 用完整克隆（CI_REPOSITORY_URL）重新检出，不需要 runner 的 checkout
    GIT_STRATEGY: none
  # 仅 main 分支的 push 流水线触发；同步 commit 带 [skip ci]，
  # 不触发流水线，不会造成同步循环
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      set -e
      echo "=== GitHub 镜像同步（CodeFuckee/botler：剔除 .gitlab-ci.yml + 脱敏）==="

      # ⚠️ code01 上存在全局代理环境变量（会干扰外网直连），
      # 与 deploy_to_code01 一致：先清理代理再走外网
      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"

      # 未配置 token 时跳过（不影响主流水线）：
      # 配置位置：Settings > CI/CD > Variables，键名 GITHUB_PUSH_TOKEN，
      # 值用 GitHub PAT（repo 写权限），勾选 Masked + Protected
      if [ -z "${GITHUB_PUSH_TOKEN:-}" ]; then
        echo "⚠️ 未配置 GITHUB_PUSH_TOKEN，跳过 GitHub 同步"
        echo "   配置方法：GitLab 项目 Settings > CI/CD > Variables 添加"
        echo "   GITHUB_PUSH_TOKEN = <GitHub PAT>（勾选 Masked + Protected）"
        exit 0
      fi

      # 完整克隆当前仓库（CI_JOB_TOKEN 只读权限即可），检出本次提交
      # （不用浅克隆：force push 浅历史会导致 GitHub 侧提交链断裂）
      SYNC_DIR="/tmp/sync-github-botler"
      rm -rf "${SYNC_DIR}"
      git clone --quiet "${CI_REPOSITORY_URL}" "${SYNC_DIR}"
      cd "${SYNC_DIR}"
      git checkout --quiet "${CI_COMMIT_SHA}"
      echo "✓ 已检出提交 ${CI_COMMIT_SHA}"

      # 剔除 .gitlab-ci.yml（GitHub 镜像不需要 GitLab 专有配置）
      git rm --quiet .gitlab-ci.yml

      # ----------------------------------------------------------
      # 脱敏：内部地址替换为示例占位符（RFC 2606 保留域名，不指向
      # 真实主机）。扫描对象 = git 跟踪的全部文本文件（git rm
      # .gitlab-ci.yml 后已不含 CI 文件；node_modules 等未跟踪
      # 目录天然排除），不受扩展名限制，未来新增文件含内部
      # 地址也会被覆盖。
      # ----------------------------------------------------------
      SENSITIVE_FILES=$(git ls-files -z | xargs -0 grep -lI \
        'home\.chenkaidi\.top:509\|10\.0\.0\.122' 2>/dev/null || true)
      if [ -n "${SENSITIVE_FILES}" ]; then
        for f in ${SENSITIVE_FILES}; do
          sed -i 's|home\.chenkaidi\.top:509|gitlab.example.com|g; s|10\.0\.0\.122|your-server.example.com|g' "$f"
          echo "🔒 已脱敏: ${f}"
        done
      else
        echo "✓ 无需脱敏（未发现内部地址）"
      fi

      git config user.name "CI Bot"
      git config user.email "ci-bot@botler.local"
      git commit --quiet -am "chore: GitHub 镜像——剔除 .gitlab-ci.yml 并脱敏内部信息 [skip ci]"

      # force push 到 GitHub main（镜像历史由本 job 全权维护）。
      # -q 抑制成功输出（push URL 不落日志；token 若配置 Masked，
      # GitLab 自动将变量值打码为 [FILTERED]）
      # detached HEAD 下 push 必须用完整 refspec（refs/heads/main），
      # 否则空仓库首次推送时 git 无法推断 main 是分支还是 tag
      # 失败自动重试：最多 10 次、间隔 10 秒，规避网络抖动/代理波动
      # 等暂时性故障
      pushed=false
      for attempt in $(seq 1 10); do
        if git push --quiet --force \
          "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/CodeFuckee/botler.git" \
          HEAD:refs/heads/main; then
          pushed=true
          break
        fi
        echo "⚠️ 第 ${attempt} 次推送失败，10 秒后重试（${attempt}/10）"
        echo "   （若提示 Repository not found：请先在 GitHub 创建空的 CodeFuckee/botler 仓库）"
        [ "$attempt" -lt 10 ] && sleep 10
      done
      if [ "$pushed" != "true" ]; then
        echo "❌ 连续 10 次推送 GitHub 失败，放弃同步"
        exit 1
      fi
      echo "✓ 已同步到 https://github.com/CodeFuckee/botler（main 分支）"
      echo "  （如需 GitHub Actions CI，可仿 Shipyard 添加 .github/workflows/ 并用 workflow_dispatch 触发）"
