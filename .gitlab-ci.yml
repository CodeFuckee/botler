# ================================================================
# Botler 统一 CI/CD 流水线
#
# 涵盖前端 (React/Vite) 和后端 (Python FastAPI) 的构建、测试和
# 部署任务（参考 Shipyard 项目的 CI 模式）。前端构建与后端测试
# 并行执行，部署阶段等待前端构建产物通过后才触发。
#
# Stage 拓扑（依赖关系）：
#
#   security（5 job 并行）──► build（3 job 并行）──► deploy ──► sync
#   ┌──────────────────────┐   ┌──────────────────────┐
#   │ bandit     后端代码SAST│   │ frontend:build ────────────► deploy_to_code01
#   │ deps-python 后端依赖CVE│   │   (React/Vite 构建)   │      (pm2 本机部署 + 健康检查)
#   │ deps-frontend 前端依赖│   │ backend:test         │
#   │ semgrep    前后端SAST │   │   (uv + pytest)      │
#   │ secrets    密钥泄露检测│   │ harmony:build ───────────┘  (鸿蒙端编译门禁, issue #173)
#   └──────────────────────┘   │   (hvigorw 编译 HAP)  │
#                              └──────────────────────┘
#
# 说明：
#   - 第零阶段 security：五种免费开源工具并行做静态代码分析
#     （issue #86「增加静态代码分析，高危/中危漏洞中止流水线」），
#     任一 job 失败即阻断后续所有 stage：
#       * security:bandit        bandit 后端代码 SAST，中危及以上阻断
#                               （issue #58，SARIF 报告）
#       * security:deps-python   pip-audit 后端依赖已知 CVE 扫描，
#                               保守阻断（PIP_AUDIT_IGNORE 可豁免）
#       * security:deps-frontend npm audit 前端依赖 CVE 扫描，
#                               moderate 及以上阻断
#       * security:semgrep       semgrep 前后端代码 SAST（内置规则
#                               文件 ci/semgrep-rules.yaml），ERROR/
#                               WARNING（高危/中危）阻断
#       * security:secrets       gitleaks 全仓库密钥泄露检测，
#                               任何发现即阻断（ci/gitleaks.toml 豁免）
#   - 第一阶段 build：frontend:build（npm 构建前端，产出 dist 产物）、
#     backend:test（uv 安装依赖 + pytest/语法检查）与 harmony:build
#     （鸿蒙端 hvigorw 真实编译，产出未签名 HAP，issue #173）并行执行
#   - 第二阶段 deploy：必须等 frontend:build 成功且拿到 dist 产物后才
#     部署到本机（code01 = 10.0.0.122，shell executor，pm2 管理 uvicorn）
#
# 部署模型（pm2 部署；issue #7 曾切换 Docker compose，现改回 pm2，
# 但保留 issue #7 的数据目录修复）：
#   - 部署目标就是 gitlab-runner 所在机器（10.0.0.122），shell executor
#   - 数据目录固定为 /home/ckd/codes/botler/data（CI 显式 export
#     BOTLER_DATA_DIR，不随 runner 构建目录漂移——构建目录可能被清理，
#     历史部署数据曾因此丢失）：data/backend/.env、data/backend/config.yaml、
#     data/backend/botler.db、data/workspace/、data/logs/、data/backups/
#     等运行时文件天然保留；构建目录/旧代码目录的散落数据首次自动
#     迁移到 data/
#   - 构建目录 backend/.env 与 backend/workspace 是指向 data/ 的
#     symlink（后端 load_dotenv / executor 默认路径硬编码在 backend/
#     下，无法用环境变量覆盖），由 deploy job 维护，数据本体在 data/
#   - 前端 dist 由 frontend:build 通过 artifacts 传入，下载位置恰好是
#     FastAPI 静态托管目录 frontend/dist，无需移动
#   - 凭据（data/backend/.env，gitignore 排除）不入库、不进日志
# ================================================================

stages:
  - security
  - build
  - e2e
  - deploy
  - sync
  - release

# ================================================================
# 全局变量
# ================================================================
variables:
  # shell executor 工作目录跨 job 持久化，GIT_CLEAN_FLAGS: none 防止
  # clean 掉运行时文件（.env / config.yaml / .venv 等）
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 镜像 / 注册表地址（国内源，可在 GitLab UI 中覆盖）
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  # dsh 引擎 SDK 安装镜像源（deploy/install-dsh-sdk.sh 读取；清华源未
  # 同步 rc 预发布版，必须阿里镜像，可在 GitLab UI 覆盖为内网代理）
  DSH_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple"
  NPM_REGISTRY_URL: "https://registry.npmmirror.com"

  # ----------------------------------------------------------
  # 部署变量
  # ----------------------------------------------------------
  APP_NAME: "botler"
  DEPLOY_PORT: "8000"
  # 部署后健康检查重试次数（×1 秒；pm2 启动较 Docker 快）
  HEALTHCHECK_RETRIES: "30"

# ================================================================
# 公共配置
# ================================================================

# --- 触发规则：docs-only 提交跳过流水线（issue #57）---
# main 分支 push 若仅变更文档（*.md / docs/ / LICENSE），跳过构建、
# 测试与部署，只保留 sync_to_github 同步镜像（docs 变更也需及时镜像
# 到 GitHub）。rules 按顺序求值：第一条「代码/配置白名单」优先于第二
# 条「docs 跳过」——代码提交通常伴随 CHANGELOG.md 变更，若先判定 docs
# 会把混合提交误判为 docs-only 跳过。其余场景（其他分支 / MR / tag /
# schedule 等）维持原行为（when: on_success，见规则 3 注释）。
.docs_only_skip:
  rules:
    # 1) 任何代码/配置路径有变更 → 正常执行（docs+代码混合提交也执行）
    # ⚠️ when 必须用 on_success 而非 always：always 会绕过 stage 失败
    # 传播与 needs 失败传播——security 门禁因高危/中危漏洞失败时，
    # build/deploy 仍照常执行（流水线 #852 实测：deps-python failed
    # 但 deploy 仍 success）。on_success 与 GitLab 默认行为一致：
    # 前序 job 失败即跳过本 job，保证门禁真正阻断后续 stage。
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - backend/**/*
        - frontend/**/*
        - deploy/**/*
        - scripts/**/*
        - ci/**/*
        - data/**/*
        - .github/**/*
        - harmony/**/*
        - Dockerfile
        - docker-compose.yml
        - .dockerignore
        - .gitignore
        - "**/*.py"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.ets"
        - "**/*.json5"
        - "**/*.css"
        - "**/*.html"
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
        - "**/*.sh"
      when: on_success
    # 2) 仅文档变更 → 跳过（不启动构建/测试/部署）
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.md"
        - docs/**/*
        - LICENSE
      when: never
    # 3) 其他分支 / MR / tag / schedule 等 → 维持原行为。
    # ⚠️ 必须用 on_success 而非 always：when: always 会绕过 stage 失败
    # 传播——security 阶段门禁因高危/中危漏洞失败时，build/deploy 仍会
    # 照常执行，阻断语义形同虚设（issue #91 流水线诊断：pipeline #846
    # 起 security 失败但 deploy 仍 success）。on_success 与 GitLab 默认
    # 行为一致：前序 stage 失败即跳过本 job。
    - when: on_success

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      # node/npm 在 $HOME/.local/bin（shell executor 的 PATH 可能不含）
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Node 版本: $(node --version 2>/dev/null || echo '未安装')"
      echo "npm 版本: $(npm --version 2>/dev/null || echo '未安装')"
      echo "npm registry: $NPM_REGISTRY_URL"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "uv 版本: $(uv --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: security —— 第零阶段：bandit 安全静态扫描（issue #58）
# ================================================================

# --- 后端：bandit 安全扫描（流水线最前置阻断门禁）---
# 扫描 backend 生产代码（botler 包），存在高危/
# 中危（--severity-level medium）漏洞时 bandit 退出码非 0，job 失败
# 阻断整个流水线（后续 build/deploy/sync 全部不运行）；低危漏洞仅
# 记录不阻断。allow_failure: false 显式声明阻断语义。
# 扫描结果同时输出 SARIF 报告（-f sarif），经 artifacts:reports:sast
# 上传 GitLab，可在 GitLab 页面可视化查看（issue #72）：
#   项目 → 安全 → 漏洞报告 / 流水线 Security 标签 / MR 安全组件
# 报告 when: always 上传——门禁因漏洞失败时页面同样展示漏洞详情，
# 详细查看方式见 docs/bandit-扫描结果查看指南.md。
# 误报处理：database.py 4 处动态列名拼接（# nosec B608）——列名均
# 来自模块级常量白名单（_TASK_FIELDS / allowed / 固定元组），非
# 外部输入，SQL 列名本身无法参数化。
# bandit 版本不 pin（取最新，与 requirements.txt 宽松风格一致）：
# 安全扫描工具的新规则本应让流水线发现新漏洞并阻断。
security:bandit:
  extends: [.backend_setup, .docs_only_skip]
  stage: security
  tags:
    - linux
    - code01
  timeout: 10m
  allow_failure: false
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  # SARIF 报告产物：上传 GitLab SAST，Security 页面可视化查看（issue #72）
  # 注意：artifacts 路径相对 job 工作目录（$CI_PROJECT_DIR 根），
  # 而扫描在 backend/ 子目录执行（.backend_setup 会 cd backend），
  # 报告实际生成于 backend/bandit-report.sarif
  artifacts:
    # when: always —— job 因发现中/高危漏洞失败时报告同样上传，
    # 保证用户在 GitLab 页面能看到被阻断的具体漏洞
    when: always
    paths:
      # reports 类型文件默认不进可下载 artifacts 归档（仅系统内部
      # 摄入），需显式加入 paths 才能在 job 页面下载原始报告
      - backend/bandit-report.sarif
    reports:
      sast: backend/bandit-report.sarif
    expire_in: 1 week
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（与 backend:test 共享，CI 缓存持久化）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

      echo "=== 2. 复用持久化虚拟环境（shell executor 工作目录跨 job 保留）==="
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi

      echo "=== 3. 安装 bandit（uv pip install 幂等）==="
      # bandit-sarif-formatter 为 bandit 注册 SARIF 输出格式（bandit
      # 内置 sarif formatter 的 entry point 未随 wheel 注册，需此包
      # 补齐 -f sarif 能力，issue #72）
      uv pip install bandit bandit-sarif-formatter -i ${PIP_INDEX_URL}

      echo "=== 4. bandit 安全扫描（severity ≥ medium 即阻断，SARIF 报告上传 Security 页面）==="
      set +e
      .venv/bin/python -m bandit -r botler --severity-level medium \
        -f sarif -o bandit-report.sarif
      BANDIT_EXIT=$?
      set -e

      echo "=== 5. 提取扫描摘要（SARIF → 日志）==="
      .venv/bin/python - <<'PYEOF'
      import json
      with open('bandit-report.sarif', encoding='utf-8') as f:
          sarif = json.load(f)
      results = sarif.get('runs', [{}])[0].get('results', [])
      if not results:
          print("未发现任何问题")
      else:
          sev_count = {}
          for r in results:
              sev = (r.get('properties') or {}).get('issue_severity', 'UNKNOWN')
              sev_count[sev] = sev_count.get(sev, 0) + 1
          print(f"发现 {len(results)} 个问题（按严重级别统计：{sev_count}）")
          for r in results:
              loc = r['locations'][0]['physicalLocation']
              uri = loc['artifactLocation']['uri'].rsplit('/', 1)[-1]
              line = loc['region'].get('startLine', '?')
              props = r.get('properties') or {}
              print(f"  [{props.get('issue_severity', '?')}/{props.get('issue_confidence', '?')}] "
                    f"{r['ruleId']} {uri}:{line}")
      PYEOF

      if [ "$BANDIT_EXIT" -ne 0 ]; then
        echo "✗ 发现高危/中危漏洞，流水线阻断（漏洞详情见 GitLab Security 页面）"
        exit $BANDIT_EXIT
      fi
      echo "✓ 未发现高危/中危漏洞（低危漏洞仅记录不阻断）"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [security:bandit] 总用时: ${DURATION} 秒"
      echo "========================================="

# ----------------------------------------------------------
# --- 后端：pip-audit 依赖已知漏洞扫描（issue #86）---
# 扫描 backend/requirements.txt 声明的 Python 依赖，与 PyPA 官方
# 漏洞数据库（PyPI JSON API / OSV）比对，发现已知 CVE 即阻断。
# pip-audit 输出不含 severity 字段（数据源不提供），任何已公开
# 漏洞保守按中危处理阻断（避免「无法定级」变成「静默放行」）；
# 可人工评估后用 CI 变量 PIP_AUDIT_IGNORE 豁免（逗号分隔漏洞 ID，
# 如 PYSEC-2024-38,GHSA-xxxx），见 ci/convert-audit-to-gitlab.py。
# 报告经 ci/convert-audit-to-gitlab.py 转为 GitLab 依赖扫描报告
# 格式，artifacts:reports:dependency_scanning 上传 Security 页面。
# 使用独立 venv（.venv-audit）——security 阶段多个 job 并行，
# 复用同一 .venv 并发安装会产生竞态。
# 审计服务不可用时（转换脚本 exit 2）自动切换备用数据源重试，
# 仍失败按基础设施故障处理（警告放行，不阻断流水线）。
# ----------------------------------------------------------
security:deps-python:
  extends: [.backend_setup, .docs_only_skip]
  stage: security
  tags:
    - linux
    - code01
  timeout: 15m
  allow_failure: false
  # 依赖扫描报告产物：GitLab Security 页面「依赖扫描」可视化
  # 报告生成于 backend/（.backend_setup 会 cd backend），
  # artifacts 路径相对 $CI_PROJECT_DIR 根目录
  artifacts:
    # when: always —— 阻断失败时报告同样上传，页面可见被阻断的漏洞
    when: always
    paths:
      - backend/deps-python-report.json
    reports:
      dependency_scanning: backend/deps-python-report.json
    expire_in: 1 week
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

      echo "=== 2. 独立 venv（.venv-audit，避免与 bandit/semgrep 并发竞态）==="
      if [ ! -x .venv-audit/bin/python ]; then
        rm -rf .venv-audit
        uv venv .venv-audit || { echo "✗ uv venv 创建失败"; exit 1; }
      fi
      AUDIT_PY="$PWD/.venv-audit/bin/python"

      echo "=== 3. 安装 pip-audit + pytest（转换脚本回归测试用）==="
      # ⚠️ 显式 --python 指定：uv 只自动发现 VIRTUAL_ENV / .venv，
      # 不会使用 .venv-audit 自定义名——不指定会误装进 .venv 导致
      # 「No module named pytest」（issue #91 流水线诊断 pipeline #850）
      uv pip install --python "$AUDIT_PY" pip-audit pytest -i ${PIP_INDEX_URL}
      # 安装后 import 验证：shell executor 工作区跨 job 持久，坏 venv
      # 残留会让 uv 误判「已安装」而跳过；验证失败则重建重装
      if ! "$AUDIT_PY" -c "import pip_audit, pytest" 2>/dev/null; then
        echo "⚠️  .venv-audit 残留损坏，重建重装"
        rm -rf .venv-audit
        uv venv .venv-audit || { echo "✗ uv venv 重建失败"; exit 1; }
        uv pip install --python "$AUDIT_PY" pip-audit pytest -i ${PIP_INDEX_URL}
        "$AUDIT_PY" -c "import pip_audit, pytest" || { echo "✗ 依赖安装失败"; exit 1; }
      fi

      echo "=== 4. 转换脚本回归测试（防脚本改动破坏阻断语义）==="
      cd "$CI_PROJECT_DIR"
      backend/.venv-audit/bin/python -m pytest ci/test_convert_audit_to_gitlab.py -q
      cd backend

      echo "=== 5. pip-audit 扫描（默认 PyPI 数据源，失败自动切 OSV）==="
      CONVERT_EXIT=2
      for SERVICE in "--vulnerability-service pypi" "--vulnerability-service osv"; do
        echo "--- 数据源: ${SERVICE} ---"
        set +e
        "$AUDIT_PY" -m pip_audit -r requirements.txt $SERVICE \
          --format json --progress-spinner off -o pip-audit.json
        AUDIT_EXIT=$?
        set -e
        if [ "$AUDIT_EXIT" -ne 0 ]; then
          # pip-audit 自身失败（网络/数据源不可用），输出多半不是有效 JSON，
          # 交由转换脚本判定为 exit 2（服务不可用）后切换数据源
          echo "⚠️  pip-audit 退出码 ${AUDIT_EXIT}（可能数据源不可用）"
        fi
        # || 捕获转换脚本退出码：exit 2（服务不可用）在 set -e 下会
        # 直接终止整个 job，重试循环永不执行（issue #91 流水线诊断）
        # 用解释器前缀调用（不依赖文件 x 位，流水线 #852 曾因
        # Permission denied 失败）
        CONVERT_EXIT=0
        "$AUDIT_PY" "$CI_PROJECT_DIR/ci/convert-audit-to-gitlab.py" pip \
          pip-audit.json deps-python-report.json || CONVERT_EXIT=$?
        [ "$CONVERT_EXIT" -ne 2 ] && break
      done

      if [ "$CONVERT_EXIT" -eq 2 ]; then
        echo "⚠️  两个数据源均不可用（基础设施故障），本次放行不阻断"
        echo "    （漏洞门禁仅在有审计数据时生效；人工可稍后手动重跑本 job）"
        CONVERT_EXIT=0
      fi
      exit $CONVERT_EXIT
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [security:deps-python] 总用时: ${DURATION} 秒"
      echo "========================================="

# ----------------------------------------------------------
# --- 前端：npm audit 依赖已知漏洞扫描（issue #86）---
# 扫描 frontend/package-lock.json 锁定的 npm 依赖，与 npm 官方
# 漏洞公告库（npmmirror 代理）比对。npm audit 输出自带 severity
# （info/low/moderate/high/critical），moderate（中危）及以上阻断，
# 低危/Info 仅记录进报告。报告经 ci/convert-audit-to-gitlab.py
# 转为 GitLab 依赖扫描报告，Security 页面可视化。
# audit 端点不可用时（转换脚本 exit 2）切官方 registry 重试，
# 仍失败按基础设施故障处理（警告放行，不阻断流水线）。
# ----------------------------------------------------------
security:deps-frontend:
  extends: [.frontend_setup, .docs_only_skip]
  stage: security
  tags:
    - linux
    - code01
  timeout: 20m
  allow_failure: false
  # node_modules 缓存（与 frontend:build 共享 key：基于
  # package-lock.json 哈希，依赖不变则跨 job 命中）
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - frontend/node_modules/
    policy: pull-push
  artifacts:
    when: always
    paths:
      - frontend/deps-frontend-report.json
    reports:
      dependency_scanning: frontend/deps-frontend-report.json
    expire_in: 1 week
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e
      # .frontend_setup 已 cd frontend

      echo "=== 1. 安装依赖（npm ci，锁文件为准）==="
      npm ci --registry=${NPM_REGISTRY_URL}

      echo "=== 2. npm audit 扫描（npmmirror 审计端点）==="
      CONVERT_EXIT=2
      for REGISTRY in "${NPM_REGISTRY_URL}" "https://registry.npmjs.org"; do
        echo "--- audit registry: ${REGISTRY} ---"
        set +e
        # npm audit 发现漏洞时退出码非 0 但 JSON 正常输出，忽略其退出码
        npm audit --json --registry=${REGISTRY} > npm-audit.json 2>npm-audit.err || true
        set -e
        # || 捕获转换脚本退出码：exit 2（服务不可用）在 set -e 下会
        # 直接终止整个 job，重试循环永不执行（issue #91 流水线诊断）
        CONVERT_EXIT=0
        python3 "$CI_PROJECT_DIR/ci/convert-audit-to-gitlab.py" npm \
          npm-audit.json deps-frontend-report.json || CONVERT_EXIT=$?
        [ "$CONVERT_EXIT" -ne 2 ] && break
        if [ "$REGISTRY" = "${NPM_REGISTRY_URL}" ]; then
          # npmmirror 审计端点不可用，清代理直连官方 registry 重试
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
        fi
      done

      if [ "$CONVERT_EXIT" -eq 2 ]; then
        echo "⚠️  audit 端点均不可用（基础设施故障），本次放行不阻断"
        echo "    （漏洞门禁仅在有审计数据时生效；人工可稍后手动重跑本 job）"
        CONVERT_EXIT=0
      fi
      exit $CONVERT_EXIT
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [security:deps-frontend] 总用时: ${DURATION} 秒"
      echo "========================================="

# ----------------------------------------------------------
# --- 前后端：semgrep 多语言代码静态分析（issue #86）---
# 与 bandit（Python 专用）互补，同一规则集一次扫描前后端代码
# （Python + JS/TS）。规则文件内置仓库（ci/semgrep-rules.yaml），
# 不依赖外网规则下载（内网 CI 网络稳定优先）。ERROR/WARNING
# （高危/中危）规则命中即阻断，INFO 仅记录。
# 使用独立 venv（.venv-semgrep）避免与 bandit/deps-python 并发
# 安装竞态。扫描跑两遍：--json 用于阻断判定与规则健康检查
# （errors 非空说明规则文件解析失败，必须 fail 防假绿），
# --sarif 用于 GitLab SAST 报告上传。
# ----------------------------------------------------------
security:semgrep:
  extends: [.backend_setup, .docs_only_skip]
  stage: security
  tags:
    - linux
    - code01
  timeout: 20m
  allow_failure: false
  artifacts:
    when: always
    paths:
      - backend/semgrep-report.sarif
    reports:
      sast: backend/semgrep-report.sarif
    expire_in: 1 week
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # semgrep 关闭遥测与版本检查（内网 CI 无外网依赖）
      export SEMGREP_SEND_METRICS=off
      export SEMGREP_ENABLE_VERSION_CHECK=0

      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

      echo "=== 2. 独立 venv（.venv-semgrep）+ 安装 semgrep ==="
      if [ ! -x .venv-semgrep/bin/python ]; then
        rm -rf .venv-semgrep
        uv venv .venv-semgrep || { echo "✗ uv venv 创建失败"; exit 1; }
      fi
      SEMGREP_PY="$PWD/.venv-semgrep/bin/python"
      # ⚠️ 显式 --python 指定：uv 只自动发现 VIRTUAL_ENV / .venv，
      # 不会使用 .venv-semgrep 自定义名——不指定会报「No virtual
      # environment found」（issue #91 流水线诊断 pipeline #850）
      uv pip install --python "$SEMGREP_PY" semgrep -i ${PIP_INDEX_URL}
      # 安装后 import 验证：shell executor 工作区跨 job 持久，坏 venv
      # 残留会让 uv 误判「已安装」而跳过；验证失败则重建重装
      if ! "$SEMGREP_PY" -c "import semgrep" 2>/dev/null; then
        echo "⚠️  .venv-semgrep 残留损坏，重建重装"
        rm -rf .venv-semgrep
        uv venv .venv-semgrep || { echo "✗ uv venv 重建失败"; exit 1; }
        uv pip install --python "$SEMGREP_PY" semgrep -i ${PIP_INDEX_URL}
        "$SEMGREP_PY" -c "import semgrep" || { echo "✗ semgrep 安装失败"; exit 1; }
      fi

      echo "=== 3. semgrep 扫描（前后端代码，ERROR/WARNING 阻断判定）==="
      cd "$CI_PROJECT_DIR"
      set +e
      backend/.venv-semgrep/bin/semgrep scan \
        --config ci/semgrep-rules.yaml \
        --severity ERROR --severity WARNING \
        --error \
        --timeout 30 \
        --json -o semgrep-result.json \
        backend/botler \
        frontend/src frontend/scripts frontend/vite.config.js 2>semgrep-scan.log
      SEMGREP_EXIT=$?
      set -e

      echo "=== 4. 规则健康检查 + 摘要输出（防规则解析失败假绿）==="
      backend/.venv-semgrep/bin/python - <<'PYEOF'
      import json
      with open('semgrep-result.json', encoding='utf-8') as f:
          res = json.load(f)
      errors = res.get('errors', [])
      if errors:
          print(f"✗ semgrep 规则文件解析失败 {len(errors)} 处，必须修复（防假绿）：")
          for e in errors:
              print("  " + (e.get('message') or '')[:200])
          raise SystemExit(1)
      hits = res.get('results', [])
      if not hits:
          print("未发现高危/中危问题")
      else:
          sev_count = {}
          for h in hits:
              sev = (h.get('extra') or {}).get('severity', '?')
              sev_count[sev] = sev_count.get(sev, 0) + 1
          print(f"发现 {len(hits)} 个问题（按严重级别统计：{sev_count}）")
          for h in hits:
              print(f"  [{h.get('extra', {}).get('severity')}] {h['check_id']} "
                    f"{h['path']}:{h['start']['line']}")
      PYEOF

      echo "=== 5. 生成 SARIF 报告（GitLab Security 页面可视化）==="
      backend/.venv-semgrep/bin/semgrep scan \
        --config ci/semgrep-rules.yaml \
        --severity ERROR --severity WARNING \
        --timeout 30 \
        --sarif -o backend/semgrep-report.sarif \
        backend/botler \
        frontend/src frontend/scripts frontend/vite.config.js 2>/dev/null || true

      echo "=== 6. 阻断判定（semgrep 自身退出码）==="
      exit $SEMGREP_EXIT
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [security:semgrep] 总用时: ${DURATION} 秒"
      echo "========================================="

# ----------------------------------------------------------
# --- 全仓库：gitleaks 密钥泄露检测（issue #86）---
# 扫描工作区全部文件中的硬编码密钥/凭据（GitLab PAT、GitHub
# token、AWS 密钥、私钥等 100+ 条内置规则），任何发现即阻断。
# 扫描范围排除运行时数据目录（data/ 含真实凭据、workspace、
# node_modules、构建产物等），配置见 ci/gitleaks.toml。
# 二进制优先复用 runner 持久目录（$HOME/.local/bin/gitleaks，
# 已人工预置），缺失时自动下载（GitHub release 直连，网络异常
# 时警告放行并提示人工预置——密钥门禁依赖二进制可用）。
# SARIF 报告上传 GitLab SAST（与 bandit/semgrep 同渠道）。
# ----------------------------------------------------------
security:secrets:
  extends: .docs_only_skip
  stage: security
  tags:
    - linux
    - code01
  timeout: 10m
  allow_failure: false
  artifacts:
    when: always
    paths:
      - gitleaks-report.sarif
    reports:
      sast: gitleaks-report.sarif
    expire_in: 1 week
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      echo "=== 1. 确保 gitleaks 可用（复用持久目录，缺失时下载）==="
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      if command -v gitleaks >/dev/null 2>&1; then
        echo "gitleaks: $(gitleaks version)（复用已安装二进制）"
      else
        echo "gitleaks 未安装，从 GitHub release 下载（v8.24.3）..."
        unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
        mkdir -p "$HOME/.local/bin"
        curl -sL --connect-timeout 15 --max-time 300 \
          -o /tmp/gitleaks.tgz \
          "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
          && tar xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks \
          && chmod +x "$HOME/.local/bin/gitleaks" \
          && echo "✓ gitleaks $(gitleaks version) 已安装到 $HOME/.local/bin"
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "⚠️  gitleaks 下载失败（网络异常），本次放行不阻断"
          echo "    人工预置方法：下载 gitleaks 二进制放到 runner 用户"
          echo "    $HOME/.local/bin/ 后重跑本 job（密钥门禁依赖二进制可用）"
          exit 0
        fi
      fi

      echo "=== 2. gitleaks 扫描工作区（--no-git：不扫历史，配置见 ci/gitleaks.toml）==="
      set +e
      gitleaks detect --no-git --source . \
        --config ci/gitleaks.toml \
        --report-path gitleaks-report.sarif \
        --report-format sarif \
        --redact 2>gitleaks-scan.log
      GITLEAKS_EXIT=$?
      set -e

      echo "=== 3. 输出扫描摘要（SARIF → 日志）==="
      python3 - <<'PYEOF'
      import json
      with open('gitleaks-report.sarif', encoding='utf-8') as f:
          sarif = json.load(f)
      results = sarif.get('runs', [{}])[0].get('results', [])
      if not results:
          print("未发现密钥泄露")
      else:
          print(f"发现 {len(results)} 处疑似密钥泄露：")
          for r in results:
              loc = r['locations'][0]['physicalLocation']
              uri = loc['artifactLocation']['uri'].rsplit('/', 1)[-1]
              line = loc['region'].get('startLine', '?')
              rule = r.get('ruleId', '?')
              print(f"  [{rule}] {uri}:{line}")
      PYEOF

      if [ "$GITLEAKS_EXIT" -ne 0 ]; then
        echo "✗ 发现硬编码密钥/凭据，流水线阻断（详情见 GitLab Security 页面）"
        echo "  误报处理：在 ci/gitleaks.toml 的 allowlist 中登记后重跑"
        exit $GITLEAKS_EXIT
      fi
      echo "✓ 未发现密钥泄露"
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [security:secrets] 总用时: ${DURATION} 秒"
      echo "========================================="

# ================================================================
# Stage: build —— 第一阶段：前端构建 + 后端测试（并行）
# ================================================================

# --- 前端：React/Vite 构建（产出 dist，供部署使用）---
frontend:build:
  extends: [.frontend_setup, .docs_only_skip]
  stage: build
  tags:
    - linux
    - code01
  timeout: 20m
  # node_modules 缓存（runner 全局缓存目录，构建目录被 git clean 后
  # npm ci 也能从缓存快速恢复；key 基于 package-lock.json 哈希，
  # 依赖不变则跨提交命中）
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - frontend/node_modules/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - echo "=== 1. 安装依赖（npm ci）==="
    - npm ci --registry=${NPM_REGISTRY_URL}
    - echo "=== 2. 前端测试 + 覆盖率（node --test + c8，issue 210）==="
    # c8（v8 引擎原生覆盖率）统计 src/ 源码，cobertura 报告供 GitLab
    # coverage_report 摄入；--check-coverage 设置行/分支/函数/语句阈值，
    # 低于阈值（新代码无测试悄然合入）时 job 失败阻断流水线
    - npm run test:coverage
    - echo "=== 3. 构建前端（vite build）==="
    # 版本自增（issue #9）：BOTLER_DATA_DIR 指向持久数据目录（构建目录
    # 可能被清理，版本号不能存那里），gen-version.mjs 读取/自增
    # data/version.txt（patch 位 +1）并生成 public/version.json
    # （含构建时间），vite 构建时自动复制进 dist/
    - export BOTLER_DATA_DIR=/home/ckd/codes/botler/data
    - npm run build
    - echo "=== 4. 验证构建产物 ==="
    - ls -la dist/index.html
    - echo "--- dist/version.json（版本号 + 构建时间）---"
    - cat dist/version.json
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/dist
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 1 day

# --- 鸿蒙端：编译（hvigorw 真实 ArkTS 编译，issue #173）---
# Botler 鸿蒙端（harmony/，系统 Web 组件套壳）在 code01 上使用本机华为
# 命令行工具链（~/command-line-tools：HarmonyOS 6.1.1 / API 24 SDK +
# hvigor 6.24.3 + ohpm 6.1.2）做真实编译，产出未签名 HAP：
#   1. python3 结构校验（harmony/scripts/validate_harmony.py，秒级快速失败，
#      配置缺失/引用断裂前置检出，不消耗编译时间）；
#   2. ohpm install（当前无三方依赖，秒级完成，为后续扩展预留）；
#   3. hvigorw assembleHap（debug 未签名——CI 只验证「可编译性」，正式
#      发布签名需在 DevEco Studio 中配置自动签名，见 harmony/README.md）。
# 门禁：编译失败即阻断流水线（docs_only_skip 的 on_success 传播），
# 保证「鸿蒙端不可编译不部署」。
harmony:build:
  extends: [.docs_only_skip]
  stage: build
  tags:
    - linux
    - code01
  timeout: 20m
  # hvigor 增量缓存（构建目录跨 job 持久化，key 基于 oh-package 依赖声明）
  cache:
    key:
      files:
        - harmony/oh-package.json5
        - harmony/entry/oh-package.json5
      prefix: harmony-hvigor
    paths:
      - harmony/.hvigor/
      - harmony/entry/build/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e
      # 华为鸿蒙命令行工具链（shell executor 本机安装，PATH 可能不含）
      export PATH="$HOME/command-line-tools/bin:$PATH"
      export DEVECO_SDK_HOME="$HOME/command-line-tools/sdk"
      if [ ! -x "$HOME/command-line-tools/bin/hvigorw" ]; then
        echo "❌ 未找到鸿蒙命令行工具链: $HOME/command-line-tools/bin/hvigorw"
        exit 1
      fi
      echo "=== 环境信息 ==="
      echo "hvigorw: $(hvigorw --version)"
      echo "ohpm: $(ohpm --version)"
      echo "DEVECO_SDK_HOME: $DEVECO_SDK_HOME"
    - echo "=== 1. 工程结构校验（validate_harmony.py）==="
    - python3 harmony/scripts/validate_harmony.py
    - echo "=== 2. 依赖安装（ohpm install）==="
    - cd harmony
    - ohpm install
    - echo "=== 3. 鸿蒙编译（hvigorw assembleHap，debug 未签名）==="
    - hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
    - echo "=== 4. 验证 HAP 产物 ==="
    - ls -la entry/build/default/outputs/default/*.hap
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [harmony:build] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - harmony/entry/build/default/outputs/default/*.hap
    expire_in: 1 week

# --- 后端：Python 测试（uv 高速包管理）---
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，与 Shipyard 的 backend:test 同模式。
backend:test:
  extends: [.backend_setup, .docs_only_skip]
  stage: build
  tags:
    - linux
    - code01
  timeout: 30m
  # 覆盖率提取正则（issue #210）：解析 pytest-cov term-missing 日志的
  # TOTAL 行，驱动项目覆盖率徽章与流水线页面覆盖率展示（GitLab 17+ 由
  # job 级 coverage 关键字替代旧项目设置 test_coverage_regex）
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\.?\d*)%/'
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      echo "uv: $(uv --version)"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (确保 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建/复用虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，.venv 复用；全新环境才创建
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖 ==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行测试（pytest-xdist 并行 + pytest-cov 覆盖率，issue #210/#211）==="
      # 并行加速（issue #211）：pytest-xdist -n 多进程分片，默认 auto（CPU 核数），
      # 但封顶 8 worker——code01 上 backend:test 与 frontend:build / harmony:build
      # 同 stage 并行，本地实测 16 worker 因资源争抢反而略慢（16→72s vs 8→69s，
      # 串行基线 350s）；可用 CI 变量 PYTEST_WORKERS 覆盖为固定值（如 4）。
      # 各用例使用独立 tmp_path SQLite 临时库（backend/tests 均为 per-test 隔离），
      # 无共享状态，可安全并行；pytest-cov 与 xdist 兼容，各 worker 覆盖率自动合并，
      # --cov-fail-under 门禁仍基于合并后总覆盖率判定
      # （改造前串行基线：CI 2112 例 327 秒 / 流水线 #1169 实测）
      PYTEST_WORKERS="${PYTEST_WORKERS:-auto}"
      if [ "$PYTEST_WORKERS" = "auto" ]; then
        NPROC=$(nproc)
        PYTEST_WORKERS=$(( NPROC > 8 ? 8 : NPROC ))
      fi
      if [ -d tests ]; then
        echo "→ pytest-xdist 并行 worker 数: ${PYTEST_WORKERS}（CPU 核数: $(nproc)）"
        $PYTHON -m pytest tests/ -v --tb=short -n "${PYTEST_WORKERS}" \
          --cov=botler --cov-report=term-missing --cov-report=xml \
          --cov-fail-under=70
      else
        echo "⚠️  未发现 tests/ 目录，执行语法与导入冒烟检查"
        $PYTHON -m compileall botler -q && echo "✓ 语法检查通过"
        # ⚠️ 不 import botler.main：模块级 create_app() 会加载 config.yaml，
        #    凭据环境变量（GITLAB_BOT_TOKEN 等）在 CI 中未设置会导致
        #    ValueError。仅导入无副作用的顶层包。
        $PYTHON -c "import botler; print('✓ botler 包导入成功 (v' + botler.__version__ + ')')"
      fi
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行测试) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (确保 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (虚拟环境):         $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装依赖):         $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行测试):         $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="
      # 并行前后耗时对比（issue #211 验收标准）：改造前串行基线 2112 例用时 327 秒
      # （流水线 #1169，2026-08-19 实测）；本次并行（worker=${PYTEST_WORKERS}）用时见上。
      echo "📊 并行对比（issue #211）：改造前串行基线 327 秒 → 本次并行 $((STEP4_END - STEP4_START)) 秒"
      echo "   （基线：流水线 #1169 backend:test 步骤4，2112 passed in 324.70s）"
  # 覆盖率报告（issue #210）：上传 GitLab coverage_report，MR 页面展示
  # 覆盖率对比；when: always 保证即使阈值未达（job 失败）报告也可下载查看
  artifacts:
    when: always
    paths:
      - backend/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week

# ================================================================
# Stage: e2e —— 浏览器级端到端测试（Playwright，issue #212）
# ----------------------------------------------------------------
# 在 code01（shell executor）上起真实后端（uvicorn，独立端口 8011，
# 避开生产 8000）+ 真实前端构建产物（vite preview，/api 代理到后端），
# Playwright 真浏览器跑核心链路：概览页加载与 issue 展示 / 添加 Issue
# 弹窗提交 / 设置页保存配置 / 任务详情 SSE 事件流。GitLab 依赖接口由
# 浏览器级 mock 兜底（frontend/e2e/support/mock-api.js），后端用假
# GitLab 地址 + 种子数据库，稳定且不依赖真实 GitLab。
# 门禁：e2e 失败 → 后续 deploy 不执行（docs_only_skip 的 on_success
# 传播），保证「E2E 未通过不部署」。
# ================================================================
e2e:playwright:
  extends: [.docs_only_skip]
  stage: e2e
  tags:
    - linux
    - code01
  timeout: 25m
  # 依赖 frontend:build 的 dist 产物（artifacts 自动传入本 job）
  dependencies:
    - frontend:build
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - frontend/node_modules/
    policy: pull
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # shell executor 的 PATH 可能不含 node/uv
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$HOME/.cargo/bin:$PATH"
      # Playwright 浏览器下载镜像（国内网络；本机已缓存 chromium-1234 时
      # playwright install 直接命中缓存，不触发下载）
      export PLAYWRIGHT_DOWNLOAD_HOST="${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/playwright}"

      STEP1_START=$(date +%s)
      echo "=== 1. 后端依赖（uv 安装，与 backend:test 同模式）==="
      cd backend
      if ! command -v uv >/dev/null 2>&1; then
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      cd ..
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (后端依赖) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 前端依赖 + Playwright 浏览器 ==="
      cd frontend
      npm ci --registry=${NPM_REGISTRY_URL}
      npx playwright install chromium
      cd ..
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (前端依赖) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 启动 uvicorn + vite preview 并运行 Playwright E2E ==="
      echo "E2E 目录: frontend/e2e（配置见 playwright.config.js）"
      # 端口动态分配（issue #235）：共享 runner 上固定端口 8011/4173 可能被
      # 其他项目进程占用（曾出现外部 Django 占用 8011 导致 e2e 后端无法启动），
      # 运行时探测空闲端口并通过 E2E_BACKEND_PORT/E2E_FRONTEND_PORT 注入，
      # 避免端口冲突（start-servers.sh 已支持这两个环境变量）
      E2E_PY="$PWD/backend/.venv/bin/python"
      if [ -z "${E2E_BACKEND_PORT:-}" ]; then
        E2E_BACKEND_PORT=$("$E2E_PY" -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
      fi
      if [ -z "${E2E_FRONTEND_PORT:-}" ]; then
        E2E_FRONTEND_PORT=$("$E2E_PY" -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
      fi
      export E2E_BACKEND_PORT E2E_FRONTEND_PORT
      echo "[e2e] 动态端口: backend=$E2E_BACKEND_PORT frontend=$E2E_FRONTEND_PORT"
      bash frontend/e2e/scripts/start-servers.sh
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (E2E 运行) 用时: $((STEP3_END - STEP3_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [e2e:playwright] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 7 days

# ================================================================
# Stage: deploy —— 第二阶段：本机部署（pm2 + 健康检查）
# 在 gitlab-runner 机器（code01 = 10.0.0.122）上直接部署，无需
# SSH / docker（与 Shipyard 的 deploy_to_code01 同构）。数据固定在
# /home/ckd/codes/botler/data（BOTLER_DATA_DIR，见文件头部署模型）；
# 构建目录 backend/.env 与 backend/workspace 是指向 data/ 的 symlink
# （后端 load_dotenv / executor 默认路径硬编码，无法用环境变量覆盖）。
# 原 Docker 部署退役，部署前自动停止旧 Docker 容器避免端口冲突
# （Docker / systemd 仍保留为手动部署备选）。
# ================================================================
deploy_to_code01:
  extends: .docs_only_skip
  stage: deploy
  tags:
    - linux
    - code01
  timeout: 30m
  # 第二阶段门禁：frontend:build 成功且拿到 dist 产物后才部署
  # （dist 下载位置恰好是 FastAPI 静态托管目录 frontend/dist）
  # ⚠️ 同时依赖全部 5 个 security job：needs 会绕过 stage 顺序与
  # rules 的失败传播判定，若不显式列出，security 门禁失败时 deploy
  # 仍会执行（issue #91 流水线诊断：pipeline #846 起 security 失败
  # 但 deploy 仍 success）。security 任一 job（allow_failure: false）
  # 失败即阻止部署——高危/中危漏洞中止流水线的核心语义。
  needs:
    - job: frontend:build
      artifacts: true
    - job: security:bandit
    - job: security:deps-python
    - job: security:deps-frontend
    - job: security:semgrep
    - job: security:secrets
  before_script:
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "当前用户: $(whoami)"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "pm2 版本: $(pm2 --version 2>/dev/null || echo '未安装')"
  script:
    - |
      JOB_START_TIME=$(date +%s)
      # 调试进度日志（部署排查用，job 目录可直接读取）
      DBG_LOG="$CI_PROJECT_DIR/deploy_progress.log"
      dbg() { echo "$(date '+%H:%M:%S') [$1] $2" >> "$DBG_LOG"; }
      # ⚠️ 只输出注入状态标记，绝不输出变量值（避免凭据落盘）
      GBT=$([ -n "${GITLAB_BOT_TOKEN:-}" ] && echo 已注入 || echo 未注入)
      WHS=$([ -n "${WEBHOOK_SECRET:-}" ] && echo 已注入 || echo 未注入)
      dbg START "CI_PROJECT_DIR=$CI_PROJECT_DIR 凭据注入状态: GITLAB_BOT_TOKEN=$GBT WEBHOOK_SECRET=$WHS"

      # ================================================================
      # 第 1 步：验证前端构建产物（artifacts 下载位置 = FastAPI 托管目录）
      # ================================================================
      dbg STEP1 "验证前端构建产物"
      echo "=== 1. 验证前端构建产物 ==="
      ls -la frontend/dist/index.html >> "$DBG_LOG" 2>&1 || { dbg STEP1 "FAIL: frontend/dist/index.html 不存在"; echo "错误：缺少前端构建产物 frontend/dist"; exit 1; }

      # ================================================================
      # 第 2 步：准备后端运行环境（复用跨 job 持久化的 .venv）
      # ================================================================
      dbg STEP2 "准备后端运行环境"
      echo "=== 2. 准备后端运行环境 ==="
      cd backend
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"
      if ! command -v uv >/dev/null 2>&1; then
        dbg STEP2 "uv 不在 PATH，尝试安装"
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      fi
      dbg STEP2 "uv: $(command -v uv)"
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL} || { dbg STEP2 "FAIL: uv pip install"; exit 1; }
      cd ..
      dbg STEP2 "OK"

      # ================================================================
      # 第 2b 步：dsh 引擎 SDK（issue #112 跟进：pm2 部署自动安装）
      # deepseek-harness-sdk 不在 requirements.txt（rc 预发布版，主依赖
      # 继续走清华源避免解析失败阻塞），由 deploy/install-dsh-sdk.sh
      # 装进同一 backend/.venv——阿里镜像 + 全版本号（DSH_INDEX_URL
      # 可覆盖）+ 幂等 + 安装后 import 校验（装不上即部署失败）。
      # 用户曾反馈 pm2 部署实例缺 SDK，此步保证 pm2 形态开箱即用。
      # ================================================================
      dbg STEP2b "安装 deepseek-harness SDK"
      echo "=== 2b. 安装 deepseek-harness SDK（dsh 引擎依赖）==="
      bash deploy/install-dsh-sdk.sh backend/.venv || { dbg STEP2b "FAIL: dsh SDK 安装失败"; echo "错误：deepseek-harness SDK 安装失败"; exit 1; }
      dbg STEP2b "OK"

      # ================================================================
      # 第 2b2 步：hermes 引擎 SDK（issue #171：hermes agent SDK 进程内集成）
      # hermes-agent 以源码分发（PyPI 无 wheel），由 deploy/install-hermes-agent.sh
      # editable 安装进同一 backend/.venv（默认源码 ~/.hermes/hermes-agent，
      # HERMES_SOURCE_DIR 可覆盖）+ 幂等 + 安装后 import 校验（装不上即部署
      # 失败）。未安装 hermes-agent 源码时脚本报错退出（hermes 引擎部署前置）。
      # ================================================================
      dbg STEP2b2 "安装 hermes-agent SDK"
      echo "=== 2b2. 安装 hermes-agent SDK（hermes 引擎依赖，issue #171）==="
      bash deploy/install-hermes-agent.sh backend/.venv || { dbg STEP2b2 "FAIL: hermes SDK 安装失败"; echo "错误：hermes-agent SDK 安装失败"; exit 1; }
      dbg STEP2b2 "OK"

      # ================================================================
      # 第 2c 步：安装 MinIO Server 二进制（issue #160，pm2 部署形态）
      # minio 为后端部署附属对象存储服务（docker 形态用 compose 镜像，
      # pm2 形态直接托管二进制）。deploy/install-minio.sh 一键安装
      # （版本锁定 + 幂等 + fail fast），默认装到 $HOME/.local/bin
      # （before_script 已 export 进 PATH）。装不上即部署失败。
      # ================================================================
      dbg STEP2c "安装 MinIO Server 二进制"
      echo "=== 2c. 安装 MinIO Server（对象存储服务，issue #160）==="
      bash deploy/install-minio.sh || { dbg STEP2c "FAIL: minio 安装失败"; echo "错误：MinIO Server 安装失败"; exit 1; }
      export MINIO_BIN="$HOME/.local/bin/minio"
      dbg STEP2c "OK"


      # ================================================================
      # 第 3 步：数据目录固定 data/ + 迁移 + 凭据 + symlink 桥接
      # 数据目录固定为 /home/ckd/codes/botler/data（用户指定，不随
      # gitlab-runner 构建目录漂移——构建目录可能被清理，历史部署数据
      # 曾因此丢失）。历史部署数据散落在构建目录（backend/.env、
      # config.yaml、botler.db、workspace/、logs/），首次切换自动迁移
      # 到 data/ 下；data/ 已有对应文件则保留 data/ 版本（服务器手动
      # 维护的配置优先）。凭据缺失时用 CI 变量生成。
      # ⚠️ 后端 load_dotenv 硬编码 backend/.env、executor 工作区默认
      # backend/workspace（无法用环境变量覆盖），构建目录内用 symlink
      # 桥接到 data/，数据本体仍在 data/（构建目录被清理只丢 symlink，
      # 下次部署自动重建）。
      # ================================================================
      dbg STEP3 "数据目录迁移 + 准备 data/backend/.env + symlink"
      echo "=== 3. 数据目录固定 data/ + 迁移 + symlink ==="
      export BOTLER_DATA_DIR=/home/ckd/codes/botler/data
      DATA_DIR="$BOTLER_DATA_DIR"
      mkdir -p "$DATA_DIR/backend" "$DATA_DIR/workspace" "$DATA_DIR/logs" "$DATA_DIR/backups"
      # 3a. 一次性迁移：构建目录散落数据 → data/（目标已存在则跳过）
      for f in .env config.yaml botler.db botler.db-wal botler.db-shm; do
        if [ -f "backend/$f" ] && [ ! -e "$DATA_DIR/backend/$f" ]; then
          mv "backend/$f" "$DATA_DIR/backend/$f"
          echo "✓ 迁移 backend/$f → data/backend/$f"
        fi
      done
      for d in workspace logs; do
        if [ -d "$d" ] && [ ! -e "$DATA_DIR/$d" ]; then
          mv "$d" "$DATA_DIR/$d"
          echo "✓ 迁移 $d/ → data/$d"
        fi
      done
      # 3b. 凭据准备（读写在 data/backend/.env；data/ 已存在则保留）
      if [ ! -f "$DATA_DIR/backend/.env" ]; then
        dbg STEP3 "data/backend/.env 不存在，尝试用 CI 变量生成"
        if [ -z "${GITLAB_BOT_TOKEN:-}" ] && [ -z "${WEBHOOK_SECRET:-}" ]; then
          dbg STEP3 "FAIL: 凭据缺失"
          echo "❌ 凭据缺失：data/backend/.env 不存在，且 CI 变量未提供"
          echo "   GITLAB_BOT_TOKEN / WEBHOOK_SECRET"
          echo "   配置方法（推荐）：GitLab 项目 Settings > CI/CD > Variables 添加"
          echo "     GITLAB_BOT_TOKEN — bot 账号 PAT（scope 至少 api + write_repository）"
          echo "     WEBHOOK_SECRET   — webhook 校验 secret（如 openssl rand -hex 32）"
          echo "   或首次手动部署时在 data/backend/ 创建 .env（参考 backend/.env.example）"
          exit 1
        fi
        : > "$DATA_DIR/backend/.env"
        for var in GITLAB_BOT_TOKEN WEBHOOK_SECRET ANTHROPIC_API_KEY ANTHROPIC_BASE_URL ANTHROPIC_MODEL; do
          [ -n "${!var:-}" ] && echo "${var}=${!var}" >> "$DATA_DIR/backend/.env"
        done
        chmod 600 "$DATA_DIR/backend/.env"
        echo "✓ 已用 CI 变量生成 data/backend/.env（变量：$(cut -d= -f1 "$DATA_DIR/backend/.env" | paste -sd ',' -)）"
        dbg STEP3 "OK: CI 变量生成"
      else
        echo "✓ data/backend/.env 已存在（保留服务器配置）"
        dbg STEP3 "OK: 已存在"
      fi
      # 3b+. minio 凭据（issue #160）：.env 缺失 MINIO_ROOT_USER /
      # MINIO_ROOT_PASSWORD 时写入（CI 变量优先，否则默认值；与
      # docker compose 注入的同名环境变量同源，pm2 配置读取此文件）。
      # 幂等：已有键不覆盖（保留服务器配置）。无论 .env 是 CI 变量
      # 生成还是服务器已有，都执行此补齐。
      for MVAR in MINIO_ROOT_USER MINIO_ROOT_PASSWORD; do
        if ! grep -q "^${MVAR}=" "$DATA_DIR/backend/.env" 2>/dev/null; then
          if [ "$MVAR" = "MINIO_ROOT_USER" ]; then
            echo "MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}" >> "$DATA_DIR/backend/.env"
          else
            echo "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}" >> "$DATA_DIR/backend/.env"
          fi
          echo "✓ 已写入 $MVAR 到 data/backend/.env"
        fi
      done
      chmod 600 "$DATA_DIR/backend/.env"
      dbg STEP3 "OK: minio 凭据就绪"
      if [ ! -f "$DATA_DIR/backend/config.yaml" ]; then
        echo "⚠️  data/backend/config.yaml 不存在，用示例配置兜底"
        cp backend/config.example.yaml "$DATA_DIR/backend/config.yaml"
      else
        echo "✓ data/backend/config.yaml 存在"
      fi
      # 3c. symlink 桥接（构建目录 backend/.env / backend/workspace →
      #     data/；构建目录遗留的旧数据文件移除，以 data/ 为准）
      for link in .env workspace; do
        if [ -e "backend/$link" ] && [ ! -L "backend/$link" ]; then
          rm -rf "backend/$link"
          echo "✓ 移除构建目录旧 backend/$link（数据以 data/ 为准）"
        fi
      done
      ln -sf "$DATA_DIR/backend/.env" backend/.env
      ln -sf "$DATA_DIR/workspace" backend/workspace
      echo "✓ symlink: backend/.env → data/backend/.env，backend/workspace → data/workspace"

      # ================================================================
      # 第 4 步：停止旧部署（Docker 残留容器 + 旧 pm2，防 8000 端口冲突）
      # Docker / systemd 仍保留为手动部署备选，互斥运行
      # ⚠️ code01 同时存在 rootful（/var/run/docker.sock）与 rootless
      # （/run/user/$(id -u)/docker.sock）两个 daemon，历史 Docker 部署
      # 容器可能落在任一 daemon（issue #13 曾发现 rootless 侧残留）；
      # 且 runner 构建目录可能已被清理，compose down 依赖配置文件会
      # 失败，故用容器 label/名称过滤直接删除，两个 daemon 都处理。
      # ================================================================
      dbg STEP4 "停止旧部署（双 daemon docker 残留清理 + pm2 delete）"
      echo "=== 4. 停止旧部署（Docker 双 daemon 残留清理 + pm2）==="
      if command -v docker >/dev/null 2>&1; then
        for DAEMON in "unix:///var/run/docker.sock" "unix:///run/user/$(id -u)/docker.sock"; do
          DOCKER_HOST=$DAEMON docker info >/dev/null 2>&1 || continue
          DEAD=$( { DOCKER_HOST=$DAEMON docker ps -aq --filter label=com.docker.compose.project=botler; \
                    DOCKER_HOST=$DAEMON docker ps -aq --filter name=^/botler$; } 2>/dev/null | sort -u )
          if [ -n "$DEAD" ]; then
            for c in $DEAD; do
              DOCKER_HOST=$DAEMON docker rm -f "$c" >/dev/null 2>&1 && echo "✓ [$DAEMON] 已删除旧部署残留容器 $c" || echo "⚠️ [$DAEMON] 删除容器 $c 失败（继续）"
            done
          else
            echo "✓ [$DAEMON] 无 botler 残留容器"
          fi
        done
        dbg STEP4 "OK: Docker 双 daemon 已检查"
      else
        echo "✓ docker 不可用，无需停止"
        dbg STEP4 "OK: docker 不可用"
      fi
      # minio（issue #160）与 botler 一起由 pm2 管理，旧实例一并
      # 停止（防 9000 端口被旧进程占用导致新实例 EADDRINUSE）
      PM2_APPS="${APP_NAME} botler-minio botler-terminal"
      for APP in $PM2_APPS; do
        if command -v pm2 >/dev/null 2>&1 && pm2 describe "$APP" >/dev/null 2>&1; then
          pm2 delete "$APP" >/dev/null 2>&1 && echo "✓ 已停止旧 pm2 $APP" || echo "⚠️ pm2 delete $APP 失败（继续）"
        else
          echo "✓ 无运行中的 pm2 $APP（或 pm2 未安装），无需停止"
        fi
      done
      pm2 save >/dev/null 2>&1 || true
      dbg STEP4 "OK: 旧 pm2 已停止"

      # ================================================================
      # 第 5 步：确保 pm2 可用（未安装则全局安装）
      # ================================================================
      dbg STEP5 "确保 pm2 可用"
      echo "=== 5. 确保 pm2 可用 ==="
      export PATH="$(npm config get prefix 2>/dev/null || echo "$HOME/.local"):$PATH"
      if ! command -v pm2 >/dev/null 2>&1; then
        echo "pm2 未安装，全局安装（${NPM_REGISTRY_URL}）..."
        dbg STEP5 "安装 pm2..."
        npm install -g pm2 --registry=${NPM_REGISTRY_URL} || { dbg STEP5 "FAIL: pm2 安装失败"; echo "错误：pm2 安装失败"; exit 1; }
      fi
      echo "pm2: $(pm2 --version)"
      dbg STEP5 "OK: $(pm2 --version)"

      # ================================================================
      # 第 6 步：启动/重启 botler（pm2，配置见 deploy/botler.config.cjs）
      # ⚠️ 不用 pm2 restart：restart 保留旧配置（进程信息在 pm2 守护
      # 进程里），botler.config.cjs 的修改不会生效。delete + start 确保
      # 每次部署都加载最新配置。
      # ================================================================
      dbg STEP6 "pm2 delete + start"
      echo "=== 6. 启动 botler 服务 ==="
      pm2 delete ${APP_NAME} >/dev/null 2>&1 || true
      # ⚠️ 配置文件必须是 .cjs：job 目录在 botler 项目下（package.json 含
      # type: module），.js 会被当作 ESM 解析导致 require 未定义
      pm2 start deploy/botler.config.cjs >> "$DBG_LOG" 2>&1 || { dbg STEP6 "FAIL: pm2 start"; echo "错误：pm2 start 失败"; exit 1; }
      pm2 save >/dev/null 2>&1 || true
      dbg STEP6 "OK"
      sleep 3

      # ================================================================
      # 第 7 步：等待服务就绪（健康检查，失败必须 exit 1 不能假绿）
      # ================================================================
      dbg STEP7 "健康检查 http://localhost:${DEPLOY_PORT}/api/health"
      echo "=== 7. 等待服务就绪（http://localhost:${DEPLOY_PORT}）==="
      HEALTHY=false
      for i in $(seq 1 ${HEALTHCHECK_RETRIES:-30}); do
        if curl -sf "http://localhost:${DEPLOY_PORT}/api/health" >/dev/null 2>&1; then
          echo "✓ 后端健康检查通过 (${i}s)"
          dbg STEP7 "OK: 健康检查通过 (${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done
      # ⚠️ 假绿防御：健康检查可能打到被旧进程占用的端口（如手动部署
      # /旧部署方式未停止，EADDRINUSE 导致 uvicorn 崩溃重启循环）。
      # pm2 restarts ≥ 3 即判定健康检查并非来自本进程，标记失败。
      if [ "$HEALTHY" = true ]; then
        PM2_RESTARTS=$(pm2 jlist 2>/dev/null | python3 -c "import json,sys;apps=json.load(sys.stdin);print(next((a['pm2_env'].get('restart_time',0) for a in apps if a.get('name')=='$APP_NAME'),0))")
        dbg STEP7 "pm2 restarts=${PM2_RESTARTS}"
        if [ "${PM2_RESTARTS:-0}" -ge 3 ]; then
          echo "❌ 假绿检测：pm2 进程 restarts=${PM2_RESTARTS}（崩溃重启循环）"
          echo "   健康检查可能打到了其他进程占用的 8000 端口（旧部署方式/手动进程未停止）"
          HEALTHY=false
        fi
      fi
      if [ "$HEALTHY" = false ]; then
        dbg STEP7 "FAIL: 健康检查 ${HEALTHCHECK_RETRIES:-30} 次全部失败或假绿"
        dbg STEP7 "pm2 状态: $(pm2 describe ${APP_NAME} 2>/dev/null | grep -E 'status|restarts' | tr '\n' ' ')"
        dbg STEP7 "8000 端口: $(ss -tlnp 2>/dev/null | grep ':8000' | tr '\n' ' ')"
      fi
      # 7b. MinIO 服务健康检查（issue #160）：后端健康通过后，再等
      # minio 就绪（/minio/health/live，pm2 托管，端口 9000）。
      # 失败同样视为部署失败（exit 1），不允许带病运行。
      if [ "$HEALTHY" = true ]; then
        dbg STEP7b "MinIO 健康检查 http://localhost:9000/minio/health/live"
        MINIO_HEALTHY=false
        for i in $(seq 1 ${HEALTHCHECK_RETRIES:-30}); do
          if curl -sf "http://localhost:9000/minio/health/live" >/dev/null 2>&1; then
            echo "✓ MinIO 健康检查通过 (${i}s)"
            dbg STEP7b "OK: MinIO 健康检查通过 (${i}s)"
            MINIO_HEALTHY=true
            break
          fi
          echo "  MinIO 等待中... (${i}s)"
          sleep 1
        done
        if [ "$MINIO_HEALTHY" = false ]; then
          echo "❌ MinIO 健康检查 ${HEALTHCHECK_RETRIES:-30} 次全部失败"
          dbg STEP7b "FAIL: MinIO 未就绪"
          pm2 describe botler-minio 2>/dev/null | grep -E "status|restarts" | tr '\n' ' ' || true
          HEALTHY=false
        fi
      fi
      # 7c. 终端服务健康检查（issue #183）：经主后端 /api/terminal/health
      # 反向代理探活独立终端服务进程（pm2 botler-terminal，Tornado+terminado）。
      # 失败同样视为部署失败（exit 1），不允许带病运行。
      if [ "$HEALTHY" = true ]; then
        dbg STEP7c "终端服务健康检查 http://localhost:${DEPLOY_PORT}/api/terminal/health"
        TERM_HEALTHY=false
        for i in $(seq 1 ${HEALTHCHECK_RETRIES:-30}); do
          if curl -sf "http://localhost:${DEPLOY_PORT}/api/terminal/health" >/dev/null 2>&1; then
            echo "✓ 终端服务健康检查通过 (${i}s)"
            dbg STEP7c "OK: 终端服务健康检查通过 (${i}s)"
            TERM_HEALTHY=true
            break
          fi
          echo "  终端服务等待中... (${i}s)"
          sleep 1
        done
        if [ "$TERM_HEALTHY" = false ]; then
          echo "❌ 终端服务健康检查 ${HEALTHCHECK_RETRIES:-30} 次全部失败"
          dbg STEP7c "FAIL: 终端服务未就绪"
          pm2 describe botler-terminal 2>/dev/null | grep -E "status|restarts" | tr '\n' ' ' || true
          HEALTHY=false
        fi
      fi

      # ================================================================
      # 第 8 步：验证部署结果（后端健康 + 前端页面可达）
      # ================================================================
      echo "=== 8. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "--- 后端健康检查 ---"
        curl -sf "http://localhost:${DEPLOY_PORT}/api/health" && echo "" && echo "✓ /api/health OK"
        echo "--- 前端页面检查 ---"
        if curl -sf "http://localhost:${DEPLOY_PORT}/" | grep -q '<div id="root">'; then
          echo "✓ 前端页面可达（dist 渲染）"
        else
          echo "⚠️  前端页面未返回预期内容（dist 可能未更新，检查 pm2 工作目录）"
        fi
        echo ""
        echo "=== pm2 进程状态 ==="
        pm2 describe ${APP_NAME} | grep -E "status|restarts|uptime" || pm2 ls | grep ${APP_NAME}
        echo ""
        echo "✓ 部署成功！应用运行在 http://10.0.0.122:${DEPLOY_PORT}"
      else
        echo "错误：服务健康检查未通过（${DEPLOY_PORT} 端口无响应）"
        echo ""
        echo "=== 服务状态 ==="
        pm2 ls | grep ${APP_NAME} || echo "  （进程未找到）"
        echo ""
        echo "=== 最近日志 ==="
        tail -30 "$DATA_DIR/logs/pm2-error.log" 2>/dev/null || pm2 logs ${APP_NAME} --nostream --lines 30 2>/dev/null || true
        echo ""
        echo "错误：部署验证失败，Job 标记为失败"
        exit 1
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_code01] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  # after_script（issue #13）：无论部署成功/失败都会执行，兜底清理
  # botler 相关 docker 容器残留（rootful + rootless 双 daemon）。
  # 只清理 botler 项目容器（compose label 或容器名），不误删其他
  # 项目容器（如 shipyard）。构建目录可能已被清理，compose down
  # 依赖配置文件会失败，故直接用 docker rm 按 label/名称删除。
  after_script:
    - |
      set +e
      echo "=== [after_script] 清理 botler Docker 容器残留（双 daemon）==="
      command -v docker >/dev/null 2>&1 || { echo "docker 不可用，跳过清理"; exit 0; }
      for DAEMON in "unix:///var/run/docker.sock" "unix:///run/user/$(id -u)/docker.sock"; do
        DOCKER_HOST=$DAEMON docker info >/dev/null 2>&1 || { echo "daemon 不可达: $DAEMON，跳过"; continue; }
        DEAD=$( { DOCKER_HOST=$DAEMON docker ps -aq --filter label=com.docker.compose.project=botler; \
                  DOCKER_HOST=$DAEMON docker ps -aq --filter name=^/botler$; } 2>/dev/null | sort -u )
        if [ -n "$DEAD" ]; then
          for c in $DEAD; do
            DOCKER_HOST=$DAEMON docker rm -f "$c" >/dev/null 2>&1 && echo "✓ [$DAEMON] 已清理残留容器 $c"
          done
        else
          echo "✓ [$DAEMON] 无 botler 残留容器"
        fi
      done
      echo "=== [after_script] 清理完成 ==="

# ================================================================
# Stage: sync —— GitHub 镜像同步（剔除 .gitlab-ci.yml + 内部信息脱敏）
# 在每次 main 分支 push 的流水线全部成功后，把本次提交镜像到
# GitHub（CodeFuckee/botler，公开展示用；参考 Shipyard 的
# sync_to_github，同账号同模式）。GitHub 仓库不需要 GitLab 专有
# CI 配置，同步时剔除 .gitlab-ci.yml；同时对所有包含内部地址的
# 文件做脱敏（自建 GitLab 域名、内网服务器 IP 替换为 RFC 2606
# 示例占位符），合并为一个 commit 后 force push，镜像历史由本
# job 全权维护。
#
# 脱敏规则（同步前对工作区文本文件全局替换，.gitlab-ci.yml 已
# 剔除、不进 GitHub）：
#   home.chenkaidi.top:509  →  gitlab.example.com
#   10.0.0.122              →  your-server.example.com
# 文件按内容动态扫描，未来新增含内部地址的文件也会被覆盖。
#
# 前提：GitLab CI/CD 变量 GITHUB_PUSH_TOKEN（GitHub PAT，需对
#       botler 仓库有写权限，建议勾选 Masked + Protected）。
#       未配置时本 job 跳过（exit 0），不影响主流水线。
# ================================================================
sync_to_github:
  stage: sync
  tags:
    - linux
    - code01
  # ⚠️ 不下载任何前序 stage 的 artifacts（issue #29 第三轮）：runner 默认
  # 会下载前序 stage 中有 artifacts 的 job（此处为 frontend:build 的 dist），
  # 解压到构建目录会覆盖 pm2 进程正在托管的 dist（FastAPI 静态目录）。
  # 旧 pipeline 的 sync job 若延迟排队运行（2026-08-12 实测 #674 sync 在
  # #675 deploy 之后 4 分钟才执行），会把旧版 dist 覆盖回去 → 线上前端
  # 静默回退旧版，用户看不到新功能（本次标记库页面不可见即此根因）。
  # 本 job 用完整克隆（CI_REPOSITORY_URL）工作，不需要任何构建产物。
  dependencies: []
  variables:
    # 本 job 用完整克隆（CI_REPOSITORY_URL）重新检出，不需要 runner 的 checkout
    GIT_STRATEGY: none
  # 仅 main 分支的 push 流水线触发；同步 commit 不带跳过标记，
  # 镜像 push 到 GitHub 后由其 push 事件自动触发 GitHub Actions
  #（.github/workflows/ci.yml，issue #10）；GitHub 侧无反向同步
  # 动作，不会造成同步循环
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      set -e
      echo "=== GitHub 镜像同步（CodeFuckee/botler：剔除 .gitlab-ci.yml + 脱敏）==="

      # ⚠️ code01 上存在全局代理环境变量（会干扰外网直连），
      # 与 deploy_to_code01 一致：先清理代理再走外网
      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"

      # 未配置 token 时跳过（不影响主流水线）：
      # 配置位置：Settings > CI/CD > Variables，键名 GITHUB_PUSH_TOKEN，
      # 值用 GitHub PAT（repo 写权限），勾选 Masked + Protected
      if [ -z "${GITHUB_PUSH_TOKEN:-}" ]; then
        echo "⚠️ 未配置 GITHUB_PUSH_TOKEN，跳过 GitHub 同步"
        echo "   配置方法：GitLab 项目 Settings > CI/CD > Variables 添加"
        echo "   GITHUB_PUSH_TOKEN = <GitHub PAT>（勾选 Masked + Protected）"
        exit 0
      fi

      # 完整克隆当前仓库（CI_JOB_TOKEN 只读权限即可），检出本次提交
      # （不用浅克隆：force push 浅历史会导致 GitHub 侧提交链断裂）
      SYNC_DIR="/tmp/sync-github-botler"
      rm -rf "${SYNC_DIR}"
      git clone --quiet "${CI_REPOSITORY_URL}" "${SYNC_DIR}"
      cd "${SYNC_DIR}"
      git checkout --quiet "${CI_COMMIT_SHA}"
      echo "✓ 已检出提交 ${CI_COMMIT_SHA}"

      # 剔除 .gitlab-ci.yml（GitHub 镜像不需要 GitLab 专有配置）
      git rm --quiet .gitlab-ci.yml

      # ----------------------------------------------------------
      # 脱敏：内部地址替换为示例占位符（RFC 2606 保留域名，不指向
      # 真实主机）。扫描对象 = git 跟踪的全部文本文件（git rm
      # .gitlab-ci.yml 后已不含 CI 文件；node_modules 等未跟踪
      # 目录天然排除），不受扩展名限制，未来新增文件含内部
      # 地址也会被覆盖。
      # ----------------------------------------------------------
      SENSITIVE_FILES=$(git ls-files -z | xargs -0 grep -lI \
        'home\.chenkaidi\.top:509\|10\.0\.0\.122' 2>/dev/null || true)
      if [ -n "${SENSITIVE_FILES}" ]; then
        for f in ${SENSITIVE_FILES}; do
          sed -i 's|home\.chenkaidi\.top:509|gitlab.example.com|g; s|10\.0\.0\.122|your-server.example.com|g' "$f"
          echo "🔒 已脱敏: ${f}"
        done
      else
        echo "✓ 无需脱敏（未发现内部地址）"
      fi

      git config user.name "CI Bot"
      git config user.email "ci-bot@botler.local"
      # 注意：commit 消息不得含跳过标记（GitHub 会据此跳过 push 事件
      # 触发的 Actions，而 push 触发正是本镜像的 CI 主入口，issue #10）
      git commit --quiet -am "chore: GitHub 镜像——剔除 .gitlab-ci.yml 并脱敏内部信息"

      # force push 到 GitHub main（镜像历史由本 job 全权维护）。
      # -q 抑制成功输出（push URL 不落日志；token 若配置 Masked，
      # GitLab 自动将变量值打码为 [FILTERED]）
      # detached HEAD 下 push 必须用完整 refspec（refs/heads/main），
      # 否则空仓库首次推送时 git 无法推断 main 是分支还是 tag
      # 失败自动重试：最多 10 次、间隔 10 秒，规避网络抖动/代理波动
      # 等暂时性故障
      # ⚠️ timeout 60 必须：git 自身无连接超时，github.com 直连被阻断时
      # 单次 push 会挂数分钟，10 次循环会演变成无限挂起（2026-08-11
      # issue #6 流水线实测卡死 20+ 分钟）；加 60s 超时后单次尝试快速
      # 失败进入下一次重试，10 次 ≈ 11 分钟必然收敛
      pushed=false
      for attempt in $(seq 1 10); do
        if timeout 60 git push --quiet --force \
          "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/CodeFuckee/botler.git" \
          HEAD:refs/heads/main; then
          pushed=true
          break
        fi
        echo "⚠️ 第 ${attempt} 次推送失败，10 秒后重试（${attempt}/10）"
        echo "   （若提示 Repository not found：请先在 GitHub 创建空的 CodeFuckee/botler 仓库）"
        [ "$attempt" -lt 10 ] && sleep 10
      done
      if [ "$pushed" != "true" ]; then
        echo "❌ 连续 10 次推送 GitHub 失败，放弃同步"
        exit 1
      fi
      echo "✓ 已同步到 https://github.com/CodeFuckee/botler（main 分支）"

      # ----------------------------------------------------------
      # 触发 GitHub Actions CI（issue #10）
      # 主触发：镜像 commit 不含跳过标记，push 到 GitHub 后由其 push
      # 事件自动运行 .github/workflows/ci.yml。此处再调用
      # workflow_dispatch API 补充触发一次（双保险：当前
      # GITHUB_PUSH_TOKEN 无 workflow scope 时会 403，仅警告，不影响
      # 镜像同步与 push 触发；若日后升级 token 权限，push 与 dispatch
      # 会各触发一次运行，属预期）。
      #
      # issue #57：docs-only 提交（本次 push 仅文档变更）跳过触发。
      # GitHub 侧 push 事件已被 ci.yml 的 paths 白名单拦截（纯文档
      # push 不运行 workflow），此处 dispatch 是补充入口，docs-only
      # 时一并跳过，避免白跑一次 Actions；镜像同步本身不受影响。
      # 判定基准 = CI_COMMIT_BEFORE_SHA..CI_COMMIT_SHA（本次 push 的
      # 全部变更）；BEFORE_SHA 全零（force push / 新分支）或 diff
      # 失败时保守视为含代码变更，维持原触发行为。
      # ----------------------------------------------------------
      DOCS_ONLY=0
      CHANGED_FILES=$(git diff --name-only "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}" 2>/dev/null || true)
      # 代码文件 = 变更文件中匹配「代码白名单」的集合（与上方
      # .docs_only_skip 规则及 GitHub ci.yml paths 白名单同一套定义，
      # 两边判定保持一致）；为空说明全部为文档变更。
      # 不用 grep -q（非 GNU 实现的 -q 快速退出在多行输入下行为不一），
      # 改判输出是否为空，兼容性更稳。
      NON_DOCS=$(echo "${CHANGED_FILES}" | grep -E \
        '(^backend/|^frontend/|^deploy/|^scripts/|^data/|^\.github/|^Dockerfile$|^docker-compose\.yml$|^\.dockerignore$|^\.gitignore$|\.py$|\.js$|\.jsx$|\.mjs$|\.ts$|\.tsx$|\.css$|\.html$|\.json$|\.yaml$|\.yml$|\.toml$|\.sh$)' \
        2>/dev/null || true)
      if [ -n "${CHANGED_FILES}" ] && [ -z "${NON_DOCS}" ]; then
        DOCS_ONLY=1
      fi

      echo "=== 触发 GitHub Actions workflow ==="
      if [ "${DOCS_ONLY}" = "1" ]; then
        echo "⏭️  docs-only 提交，跳过 GitHub Actions 触发（镜像已同步）"
        echo "   变更文件："
        echo "${CHANGED_FILES}" | sed 's/^/     /'
      else
        set +e
        DISPATCH_RESPONSE=$(curl -sf -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: token ${GITHUB_PUSH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/CodeFuckee/botler/actions/workflows/ci.yml/dispatches" \
          -d '{"ref":"main"}')
        DISPATCH_EXIT=$?
        set -e
        if [ "$DISPATCH_EXIT" -eq 0 ] && [ "$DISPATCH_RESPONSE" = "204" ]; then
          echo "✓ 已触发 GitHub Actions workflow（https://github.com/CodeFuckee/botler/actions）"
        else
          echo "⚠️ 触发 GitHub Actions 失败（HTTP=${DISPATCH_RESPONSE:-timeout}，exit=${DISPATCH_EXIT}），不影响镜像同步"
          echo "   若需自动 CI：确认 GITHUB_PUSH_TOKEN 为 GitHub PAT 且勾选 workflow scope"
          echo "   （github.com > Settings > Developer settings > Personal access tokens）"
        fi
      fi

# ================================================================
# Stage: release —— 自动发版（issue #294）
# 每次 main 分支 push 流水线全部成功后，检测「中间版本号 +1」（如 1.3.99 →
# 1.4.0，gen-version.mjs 逢百进位，issue #179/#283）或「首次发版（尚无任何
# 版本 tag）」→ 自动发版：复用 issue #289 轮转机制封版 [Unreleased] → 版本节
# 并重置 CHANGELOG.md、打 git tag vX.Y.Z 标记里程碑、把 CHANGELOG 变更提交
# 回 main 并推送。触发判定逻辑见 backend/botler/release.py（should_release）
# 与 scripts/release.py。
#
# rules：仅 main 分支 push 且含代码/配置变更的流水线执行；docs-only 提交 /
# tag / MR / 其他分支 / schedule 流水线一律不执行（tag 流水线不重复发版，
# docs-only 提交不发版，发版时机顺延到下一个代码提交流水线）。
# stage 顺序（sync 之后）保证 security/build/e2e/deploy/sync 全部成功后才
# 发版；发版提交仅改 CHANGELOG.md 与 docs/CHANGELOG-archive.md → 其触发的
# docs-only 流水线自动跳过构建（只跑 sync），不会循环。
# ================================================================
release:auto:
  stage: release
  tags:
    - linux
    - code01
  timeout: 10m
  # 只下载 frontend:build 的 dist 产物（读 frontend/dist/version.json 拿
  # 本次构建版本，与部署版本同源）；不下载 e2e/覆盖率等无关产物。
  # 依赖关系由 stage 顺序隐式保证（不用 needs：等待前序 stage 全部成功）。
  dependencies:
    - frontend:build
  rules:
    # 1) main 分支 push 且含代码/配置变更 → 执行发版检查
    # （与 .docs_only_skip 白名单同源：代码/配置文件命中才跑发版检查）
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - backend/**/*
        - frontend/**/*
        - deploy/**/*
        - scripts/**/*
        - ci/**/*
        - data/**/*
        - .github/**/*
        - harmony/**/*
        - Dockerfile
        - docker-compose.yml
        - .dockerignore
        - .gitignore
        - "**/*.py"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.ets"
        - "**/*.json5"
        - "**/*.css"
        - "**/*.html"
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
        - "**/*.sh"
      when: on_success
    # 2) 仅文档变更（docs-only）→ 不发版（发版时机在下一个代码提交流水线）
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.md"
        - docs/**/*
        - LICENSE
      when: never
    # 3) 其余场景（tag / MR / 其他分支 / schedule）→ 不执行发版
    - when: never
  before_script:
    - |
      set -e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      # 拉取全部 tag（浅克隆可能缺 tag，发版判定依赖「最近发布版本」）
      git fetch origin --tags --quiet || true
      git config user.name "CI Bot"
      git config user.email "ci-bot@botler.local"
  script:
    - |
      set -e
      echo "========================================="
      echo "🚀 [release:auto] 自动发版检查（issue #294：中间版本号 +1 时发布）"
      echo "========================================="
      JOB_START_TIME=$(date +%s)
      # 本次构建版本：frontend:build 产物 frontend/dist/version.json
      # （与部署版本同源，gen-version.mjs 已把 patch 位 +1）
      echo "--- frontend/dist/version.json（本次构建版本）---"
      cat frontend/dist/version.json 2>/dev/null || echo "（缺失）"
      # 推送地址：CI 变量 GITLAB_BOT_TOKEN（bot 账号 PAT，scope 至少
      # api + write_repository）；按 CI_SERVER_URL + CI_PROJECT_PATH 动态
      # 拼接，不硬编码域名。未配置时传空串 → 脚本在「需要发版」时报错
      # 中止（不静默跳过，流水线可见失败）。
      PUSH_URL=""
      if [ -n "${GITLAB_BOT_TOKEN:-}" ]; then
        GITLAB_HOST_NO_SCHEME=$(echo "$CI_SERVER_URL" | sed -E 's#^https?://##')
        PUSH_URL="https://oauth2:${GITLAB_BOT_TOKEN}@${GITLAB_HOST_NO_SCHEME}/${CI_PROJECT_PATH}.git"
      else
        echo "⚠️  GITLAB_BOT_TOKEN 未配置：若触发发版将报错中止（发版提交/tag 推送需要 write_repository 权限）"
      fi
      python3 scripts/release.py \
        --version-json frontend/dist/version.json \
        --repo-root "$CI_PROJECT_DIR" \
        --push-url "$PUSH_URL"
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [release:auto] 总用时: ${DURATION} 秒"
      echo "========================================="
