# ================================================================
# Botler 统一 CI/CD 流水线
#
# 涵盖前端 (React/Vite) 和后端 (Python FastAPI) 的构建、测试和
# 部署任务（参考 Shipyard 项目的 CI 模式）。前端构建与后端测试
# 并行执行，部署阶段等待前端构建产物通过后才触发。
#
# Stage 拓扑（依赖关系）：
#
#   build（并行）                    deploy
#   ┌──────────────────────┐
#   │ frontend:build ────────────► deploy_to_code01
#   │   (React/Vite 构建)   │      (pm2 本机部署 + 健康检查)
#   └──────────────────────┘
#
# 说明：
#   - 第一阶段 build：frontend:build（npm 构建前端，产出 dist 产物）与
#     backend:test（uv 安装依赖 + pytest/语法检查）并行执行
#   - 第二阶段 deploy：必须等 frontend:build 成功且拿到 dist 产物后才
#     部署到本机（code01 = 10.0.0.122，shell executor，pm2 管理 uvicorn）
#
# 部署模型（pm2 部署；issue #7 曾切换 Docker compose，现改回 pm2，
# 但保留 issue #7 的数据目录修复）：
#   - 部署目标就是 gitlab-runner 所在机器（10.0.0.122），shell executor
#   - 数据目录固定为 /home/ckd/codes/botler/data（CI 显式 export
#     BOTLER_DATA_DIR，不随 runner 构建目录漂移——构建目录可能被清理，
#     历史部署数据曾因此丢失）：data/backend/.env、data/backend/config.yaml、
#     data/backend/botler.db、data/workspace/、data/logs/、data/backups/
#     等运行时文件天然保留；构建目录/旧代码目录的散落数据首次自动
#     迁移到 data/
#   - 构建目录 backend/.env 与 backend/workspace 是指向 data/ 的
#     symlink（后端 load_dotenv / executor 默认路径硬编码在 backend/
#     下，无法用环境变量覆盖），由 deploy job 维护，数据本体在 data/
#   - 前端 dist 由 frontend:build 通过 artifacts 传入，下载位置恰好是
#     FastAPI 静态托管目录 frontend/dist，无需移动
#   - 凭据（data/backend/.env，gitignore 排除）不入库、不进日志
# ================================================================

stages:
  - build
  - deploy
  - sync

# ================================================================
# 全局变量
# ================================================================
variables:
  # shell executor 工作目录跨 job 持久化，GIT_CLEAN_FLAGS: none 防止
  # clean 掉运行时文件（.env / config.yaml / .venv 等）
  GIT_CLEAN_FLAGS: none

  # ----------------------------------------------------------
  # 镜像 / 注册表地址（国内源，可在 GitLab UI 中覆盖）
  # ----------------------------------------------------------
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  NPM_REGISTRY_URL: "https://registry.npmmirror.com"

  # ----------------------------------------------------------
  # 部署变量
  # ----------------------------------------------------------
  APP_NAME: "botler"
  DEPLOY_PORT: "8000"
  # 部署后健康检查重试次数（×1 秒；pm2 启动较 Docker 快）
  HEALTHCHECK_RETRIES: "30"

# ================================================================
# 公共配置
# ================================================================

# --- 前端公共配置 ---
.frontend_setup:
  before_script:
    - cd frontend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      # node/npm 在 $HOME/.local/bin（shell executor 的 PATH 可能不含）
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Node 版本: $(node --version 2>/dev/null || echo '未安装')"
      echo "npm 版本: $(npm --version 2>/dev/null || echo '未安装')"
      echo "npm registry: $NPM_REGISTRY_URL"

# --- 后端公共配置 ---
.backend_setup:
  before_script:
    - cd backend
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "uv 版本: $(uv --version 2>/dev/null || echo '未安装')"

# ================================================================
# Stage: build —— 第一阶段：前端构建 + 后端测试（并行）
# ================================================================

# --- 前端：React/Vite 构建（产出 dist，供部署使用）---
frontend:build:
  extends: .frontend_setup
  stage: build
  tags:
    - linux
    - code01
  timeout: 20m
  # node_modules 缓存（runner 全局缓存目录，构建目录被 git clean 后
  # npm ci 也能从缓存快速恢复；key 基于 package-lock.json 哈希，
  # 依赖不变则跨提交命中）
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - frontend/node_modules/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - echo "=== 1. 安装依赖（npm ci）==="
    - npm ci --registry=${NPM_REGISTRY_URL}
    - echo "=== 2. 构建前端（vite build）==="
    - npm run build
    - echo "=== 3. 验证构建产物 ==="
    - ls -la dist/index.html
    - |
      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [frontend:build] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 day

# --- 后端：Python 测试（uv 高速包管理）---
# 在 gitlab-runner 机器（code01）上直接运行（shell executor），
# 不依赖 Docker，与 Shipyard 的 backend:test 同模式。
backend:test:
  extends: .backend_setup
  stage: build
  tags:
    - linux
    - code01
  timeout: 30m
  cache:
    key: uv-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.uv-cache/
    policy: pull-push
  script:
    - JOB_START_TIME=$(date +%s)
    - |
      set -e

      # uv 缓存目录（CI 缓存持久化，加速后续构建）
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"

      STEP1_START=$(date +%s)
      echo "=== 1. 确保 uv 可用 ==="
      if ! command -v uv >/dev/null 2>&1; then
        # PEP 668 保护阻止系统级 pip install，使用 --break-system-packages
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      echo "uv: $(uv --version)"
      STEP1_END=$(date +%s)
      echo "⏱️  步骤1 (确保 uv) 用时: $((STEP1_END - STEP1_START)) 秒"

      STEP2_START=$(date +%s)
      echo "=== 2. 创建/复用虚拟环境 ==="
      # shell executor 工作目录跨 job 持久化，.venv 复用；全新环境才创建
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      PYTHON=".venv/bin/python"
      STEP2_END=$(date +%s)
      echo "⏱️  步骤2 (虚拟环境) 用时: $((STEP2_END - STEP2_START)) 秒"

      STEP3_START=$(date +%s)
      echo "=== 3. 安装项目依赖 ==="
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL}
      STEP3_END=$(date +%s)
      echo "⏱️  步骤3 (安装依赖) 用时: $((STEP3_END - STEP3_START)) 秒"

      STEP4_START=$(date +%s)
      echo "=== 4. 运行测试 ==="
      if [ -d tests ]; then
        $PYTHON -m pytest tests/ -v --tb=short
      else
        echo "⚠️  未发现 tests/ 目录，执行语法与导入冒烟检查"
        $PYTHON -m compileall botler -q && echo "✓ 语法检查通过"
        # ⚠️ 不 import botler.main：模块级 create_app() 会加载 config.yaml，
        #    凭据环境变量（GITLAB_BOT_TOKEN 等）在 CI 中未设置会导致
        #    ValueError。仅导入无副作用的顶层包。
        $PYTHON -c "import botler; print('✓ botler 包导入成功 (v' + botler.__version__ + ')')"
      fi
      STEP4_END=$(date +%s)
      echo "⏱️  步骤4 (运行测试) 用时: $((STEP4_END - STEP4_START)) 秒"

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [backend:test] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="
      echo ""
      echo "========== 各步骤耗时汇总 =========="
      echo "  步骤1 (确保 uv):          $((STEP1_END - STEP1_START)) 秒"
      echo "  步骤2 (虚拟环境):         $((STEP2_END - STEP2_START)) 秒"
      echo "  步骤3 (安装依赖):         $((STEP3_END - STEP3_START)) 秒"
      echo "  步骤4 (运行测试):         $((STEP4_END - STEP4_START)) 秒"
      echo "========================================="

# ================================================================
# Stage: deploy —— 第二阶段：本机部署（pm2 + 健康检查）
# 在 gitlab-runner 机器（code01 = 10.0.0.122）上直接部署，无需
# SSH / docker（与 Shipyard 的 deploy_to_code01 同构）。数据固定在
# /home/ckd/codes/botler/data（BOTLER_DATA_DIR，见文件头部署模型）；
# 构建目录 backend/.env 与 backend/workspace 是指向 data/ 的 symlink
# （后端 load_dotenv / executor 默认路径硬编码，无法用环境变量覆盖）。
# 原 Docker 部署退役，部署前自动停止旧 Docker 容器避免端口冲突
# （Docker / systemd 仍保留为手动部署备选）。
# ================================================================
deploy_to_code01:
  stage: deploy
  tags:
    - linux
    - code01
  timeout: 30m
  # 第二阶段门禁：frontend:build 成功且拿到 dist 产物后才部署
  # （dist 下载位置恰好是 FastAPI 静态托管目录 frontend/dist）
  needs:
    - job: frontend:build
      artifacts: true
  before_script:
    - |
      set +e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      export PATH="$HOME/.local/bin:$HOME/miniconda3/bin:$PATH"
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "当前用户: $(whoami)"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "pm2 版本: $(pm2 --version 2>/dev/null || echo '未安装')"
  script:
    - |
      JOB_START_TIME=$(date +%s)
      # 调试进度日志（部署排查用，job 目录可直接读取）
      DBG_LOG="$CI_PROJECT_DIR/deploy_progress.log"
      dbg() { echo "$(date '+%H:%M:%S') [$1] $2" >> "$DBG_LOG"; }
      # ⚠️ 只输出注入状态标记，绝不输出变量值（避免凭据落盘）
      GBT=$([ -n "${GITLAB_BOT_TOKEN:-}" ] && echo 已注入 || echo 未注入)
      WHS=$([ -n "${WEBHOOK_SECRET:-}" ] && echo 已注入 || echo 未注入)
      dbg START "CI_PROJECT_DIR=$CI_PROJECT_DIR 凭据注入状态: GITLAB_BOT_TOKEN=$GBT WEBHOOK_SECRET=$WHS"

      # ================================================================
      # 第 1 步：验证前端构建产物（artifacts 下载位置 = FastAPI 托管目录）
      # ================================================================
      dbg STEP1 "验证前端构建产物"
      echo "=== 1. 验证前端构建产物 ==="
      ls -la frontend/dist/index.html >> "$DBG_LOG" 2>&1 || { dbg STEP1 "FAIL: frontend/dist/index.html 不存在"; echo "错误：缺少前端构建产物 frontend/dist"; exit 1; }

      # ================================================================
      # 第 2 步：准备后端运行环境（复用跨 job 持久化的 .venv）
      # ================================================================
      dbg STEP2 "准备后端运行环境"
      echo "=== 2. 准备后端运行环境 ==="
      cd backend
      export UV_CACHE_DIR="$CI_PROJECT_DIR/backend/.uv-cache"
      if ! command -v uv >/dev/null 2>&1; then
        dbg STEP2 "uv 不在 PATH，尝试安装"
        pip install uv -i ${PIP_INDEX_URL} -q --break-system-packages 2>/dev/null || \
          curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      fi
      dbg STEP2 "uv: $(command -v uv)"
      if [ ! -x .venv/bin/python ]; then
        rm -rf .venv
        uv venv .venv
      fi
      uv pip install -r requirements.txt -i ${PIP_INDEX_URL} || { dbg STEP2 "FAIL: uv pip install"; exit 1; }
      cd ..
      dbg STEP2 "OK"

      # ================================================================
      # 第 3 步：数据目录固定 data/ + 迁移 + 凭据 + symlink 桥接
      # 数据目录固定为 /home/ckd/codes/botler/data（用户指定，不随
      # gitlab-runner 构建目录漂移——构建目录可能被清理，历史部署数据
      # 曾因此丢失）。历史部署数据散落在构建目录（backend/.env、
      # config.yaml、botler.db、workspace/、logs/），首次切换自动迁移
      # 到 data/ 下；data/ 已有对应文件则保留 data/ 版本（服务器手动
      # 维护的配置优先）。凭据缺失时用 CI 变量生成。
      # ⚠️ 后端 load_dotenv 硬编码 backend/.env、executor 工作区默认
      # backend/workspace（无法用环境变量覆盖），构建目录内用 symlink
      # 桥接到 data/，数据本体仍在 data/（构建目录被清理只丢 symlink，
      # 下次部署自动重建）。
      # ================================================================
      dbg STEP3 "数据目录迁移 + 准备 data/backend/.env + symlink"
      echo "=== 3. 数据目录固定 data/ + 迁移 + symlink ==="
      export BOTLER_DATA_DIR=/home/ckd/codes/botler/data
      DATA_DIR="$BOTLER_DATA_DIR"
      mkdir -p "$DATA_DIR/backend" "$DATA_DIR/workspace" "$DATA_DIR/logs" "$DATA_DIR/backups"
      # 3a. 一次性迁移：构建目录散落数据 → data/（目标已存在则跳过）
      for f in .env config.yaml botler.db botler.db-wal botler.db-shm; do
        if [ -f "backend/$f" ] && [ ! -e "$DATA_DIR/backend/$f" ]; then
          mv "backend/$f" "$DATA_DIR/backend/$f"
          echo "✓ 迁移 backend/$f → data/backend/$f"
        fi
      done
      for d in workspace logs; do
        if [ -d "$d" ] && [ ! -e "$DATA_DIR/$d" ]; then
          mv "$d" "$DATA_DIR/$d"
          echo "✓ 迁移 $d/ → data/$d"
        fi
      done
      # 3b. 凭据准备（读写在 data/backend/.env；data/ 已存在则保留）
      if [ ! -f "$DATA_DIR/backend/.env" ]; then
        dbg STEP3 "data/backend/.env 不存在，尝试用 CI 变量生成"
        if [ -z "${GITLAB_BOT_TOKEN:-}" ] && [ -z "${WEBHOOK_SECRET:-}" ]; then
          dbg STEP3 "FAIL: 凭据缺失"
          echo "❌ 凭据缺失：data/backend/.env 不存在，且 CI 变量未提供"
          echo "   GITLAB_BOT_TOKEN / WEBHOOK_SECRET"
          echo "   配置方法（推荐）：GitLab 项目 Settings > CI/CD > Variables 添加"
          echo "     GITLAB_BOT_TOKEN — bot 账号 PAT（scope 至少 api + write_repository）"
          echo "     WEBHOOK_SECRET   — webhook 校验 secret（如 openssl rand -hex 32）"
          echo "   或首次手动部署时在 data/backend/ 创建 .env（参考 backend/.env.example）"
          exit 1
        fi
        : > "$DATA_DIR/backend/.env"
        for var in GITLAB_BOT_TOKEN WEBHOOK_SECRET ANTHROPIC_API_KEY ANTHROPIC_BASE_URL ANTHROPIC_MODEL; do
          [ -n "${!var:-}" ] && echo "${var}=${!var}" >> "$DATA_DIR/backend/.env"
        done
        chmod 600 "$DATA_DIR/backend/.env"
        echo "✓ 已用 CI 变量生成 data/backend/.env（变量：$(cut -d= -f1 "$DATA_DIR/backend/.env" | paste -sd ',' -)）"
        dbg STEP3 "OK: CI 变量生成"
      else
        echo "✓ data/backend/.env 已存在（保留服务器配置）"
        dbg STEP3 "OK: 已存在"
      fi
      if [ ! -f "$DATA_DIR/backend/config.yaml" ]; then
        echo "⚠️  data/backend/config.yaml 不存在，用示例配置兜底"
        cp backend/config.example.yaml "$DATA_DIR/backend/config.yaml"
      else
        echo "✓ data/backend/config.yaml 存在"
      fi
      # 3c. symlink 桥接（构建目录 backend/.env / backend/workspace →
      #     data/；构建目录遗留的旧数据文件移除，以 data/ 为准）
      for link in .env workspace; do
        if [ -e "backend/$link" ] && [ ! -L "backend/$link" ]; then
          rm -rf "backend/$link"
          echo "✓ 移除构建目录旧 backend/$link（数据以 data/ 为准）"
        fi
      done
      ln -sf "$DATA_DIR/backend/.env" backend/.env
      ln -sf "$DATA_DIR/workspace" backend/workspace
      echo "✓ symlink: backend/.env → data/backend/.env，backend/workspace → data/workspace"

      # ================================================================
      # 第 4 步：停止旧部署（Docker 容器 + 旧 pm2，防 8000 端口冲突）
      # Docker / systemd 仍保留为手动部署备选，互斥运行
      # ================================================================
      dbg STEP4 "停止旧部署（docker compose down + pm2 delete）"
      echo "=== 4. 停止旧部署（Docker + pm2）==="
      if command -v docker >/dev/null 2>&1 && [ -n "$(docker compose -p botler ps -q 2>/dev/null)" ]; then
        export DOCKER_HOST="${DOCKER_HOST:-unix:///var/run/docker.sock}"
        docker compose -p botler down >/dev/null 2>&1 && echo "✓ 已停止 Docker 容器 botler（旧部署方式）" || echo "⚠️ docker compose down 失败（继续）"
        dbg STEP4 "OK: Docker 已停止"
      else
        echo "✓ 无运行中的 Docker 容器 botler（或 docker 不可用），无需停止"
        dbg STEP4 "OK: 无需停 Docker"
      fi
      if command -v pm2 >/dev/null 2>&1 && pm2 describe ${APP_NAME} >/dev/null 2>&1; then
        pm2 delete ${APP_NAME} >/dev/null 2>&1 && echo "✓ 已停止旧 pm2 botler" || echo "⚠️ pm2 delete 失败（继续）"
        pm2 save >/dev/null 2>&1 || true
        dbg STEP4 "OK: 旧 pm2 已停止"
      else
        echo "✓ 无运行中的 pm2 botler（或 pm2 未安装），无需停止"
        dbg STEP4 "OK: 无需停 pm2"
      fi

      # ================================================================
      # 第 5 步：确保 pm2 可用（未安装则全局安装）
      # ================================================================
      dbg STEP5 "确保 pm2 可用"
      echo "=== 5. 确保 pm2 可用 ==="
      export PATH="$(npm config get prefix 2>/dev/null || echo "$HOME/.local"):$PATH"
      if ! command -v pm2 >/dev/null 2>&1; then
        echo "pm2 未安装，全局安装（${NPM_REGISTRY_URL}）..."
        dbg STEP5 "安装 pm2..."
        npm install -g pm2 --registry=${NPM_REGISTRY_URL} || { dbg STEP5 "FAIL: pm2 安装失败"; echo "错误：pm2 安装失败"; exit 1; }
      fi
      echo "pm2: $(pm2 --version)"
      dbg STEP5 "OK: $(pm2 --version)"

      # ================================================================
      # 第 6 步：启动/重启 botler（pm2，配置见 deploy/botler.config.cjs）
      # ⚠️ 不用 pm2 restart：restart 保留旧配置（进程信息在 pm2 守护
      # 进程里），botler.config.cjs 的修改不会生效。delete + start 确保
      # 每次部署都加载最新配置。
      # ================================================================
      dbg STEP6 "pm2 delete + start"
      echo "=== 6. 启动 botler 服务 ==="
      pm2 delete ${APP_NAME} >/dev/null 2>&1 || true
      # ⚠️ 配置文件必须是 .cjs：job 目录在 botler 项目下（package.json 含
      # type: module），.js 会被当作 ESM 解析导致 require 未定义
      pm2 start deploy/botler.config.cjs >> "$DBG_LOG" 2>&1 || { dbg STEP6 "FAIL: pm2 start"; echo "错误：pm2 start 失败"; exit 1; }
      pm2 save >/dev/null 2>&1 || true
      dbg STEP6 "OK"
      sleep 3

      # ================================================================
      # 第 7 步：等待服务就绪（健康检查，失败必须 exit 1 不能假绿）
      # ================================================================
      dbg STEP7 "健康检查 http://localhost:${DEPLOY_PORT}/api/health"
      echo "=== 7. 等待服务就绪（http://localhost:${DEPLOY_PORT}）==="
      HEALTHY=false
      for i in $(seq 1 ${HEALTHCHECK_RETRIES:-30}); do
        if curl -sf "http://localhost:${DEPLOY_PORT}/api/health" >/dev/null 2>&1; then
          echo "✓ 后端健康检查通过 (${i}s)"
          dbg STEP7 "OK: 健康检查通过 (${i}s)"
          HEALTHY=true
          break
        fi
        echo "  等待中... (${i}s)"
        sleep 1
      done
      # ⚠️ 假绿防御：健康检查可能打到被旧进程占用的端口（如手动部署
      # /旧部署方式未停止，EADDRINUSE 导致 uvicorn 崩溃重启循环）。
      # pm2 restarts ≥ 3 即判定健康检查并非来自本进程，标记失败。
      if [ "$HEALTHY" = true ]; then
        PM2_RESTARTS=$(pm2 jlist 2>/dev/null | python3 -c "import json,sys;apps=json.load(sys.stdin);print(next((a['pm2_env'].get('restart_time',0) for a in apps if a.get('name')=='$APP_NAME'),0))")
        dbg STEP7 "pm2 restarts=${PM2_RESTARTS}"
        if [ "${PM2_RESTARTS:-0}" -ge 3 ]; then
          echo "❌ 假绿检测：pm2 进程 restarts=${PM2_RESTARTS}（崩溃重启循环）"
          echo "   健康检查可能打到了其他进程占用的 8000 端口（旧部署方式/手动进程未停止）"
          HEALTHY=false
        fi
      fi
      if [ "$HEALTHY" = false ]; then
        dbg STEP7 "FAIL: 健康检查 ${HEALTHCHECK_RETRIES:-30} 次全部失败或假绿"
        dbg STEP7 "pm2 状态: $(pm2 describe ${APP_NAME} 2>/dev/null | grep -E 'status|restarts' | tr '\n' ' ')"
        dbg STEP7 "8000 端口: $(ss -tlnp 2>/dev/null | grep ':8000' | tr '\n' ' ')"
      fi

      # ================================================================
      # 第 8 步：验证部署结果（后端健康 + 前端页面可达）
      # ================================================================
      echo "=== 8. 验证部署 ==="
      if [ "$HEALTHY" = true ]; then
        echo "--- 后端健康检查 ---"
        curl -sf "http://localhost:${DEPLOY_PORT}/api/health" && echo "" && echo "✓ /api/health OK"
        echo "--- 前端页面检查 ---"
        if curl -sf "http://localhost:${DEPLOY_PORT}/" | grep -q '<div id="root">'; then
          echo "✓ 前端页面可达（dist 渲染）"
        else
          echo "⚠️  前端页面未返回预期内容（dist 可能未更新，检查 pm2 工作目录）"
        fi
        echo ""
        echo "=== pm2 进程状态 ==="
        pm2 describe ${APP_NAME} | grep -E "status|restarts|uptime" || pm2 ls | grep ${APP_NAME}
        echo ""
        echo "✓ 部署成功！应用运行在 http://10.0.0.122:${DEPLOY_PORT}"
      else
        echo "错误：服务健康检查未通过（${DEPLOY_PORT} 端口无响应）"
        echo ""
        echo "=== 服务状态 ==="
        pm2 ls | grep ${APP_NAME} || echo "  （进程未找到）"
        echo ""
        echo "=== 最近日志 ==="
        tail -30 "$DATA_DIR/logs/pm2-error.log" 2>/dev/null || pm2 logs ${APP_NAME} --nostream --lines 30 2>/dev/null || true
        echo ""
        echo "错误：部署验证失败，Job 标记为失败"
        exit 1
      fi

      JOB_END_TIME=$(date +%s)
      DURATION=$((JOB_END_TIME - JOB_START_TIME))
      echo "========================================="
      echo "⏱️  [deploy_to_code01] 总用时: ${DURATION} 秒 ($(($DURATION / 60)) 分 $((DURATION % 60)) 秒)"
      echo "========================================="

# ================================================================
# Stage: sync —— GitHub 镜像同步（剔除 .gitlab-ci.yml + 内部信息脱敏）
# 在每次 main 分支 push 的流水线全部成功后，把本次提交镜像到
# GitHub（CodeFuckee/botler，公开展示用；参考 Shipyard 的
# sync_to_github，同账号同模式）。GitHub 仓库不需要 GitLab 专有
# CI 配置，同步时剔除 .gitlab-ci.yml；同时对所有包含内部地址的
# 文件做脱敏（自建 GitLab 域名、内网服务器 IP 替换为 RFC 2606
# 示例占位符），合并为一个 commit 后 force push，镜像历史由本
# job 全权维护。
#
# 脱敏规则（同步前对工作区文本文件全局替换，.gitlab-ci.yml 已
# 剔除、不进 GitHub）：
#   home.chenkaidi.top:509  →  gitlab.example.com
#   10.0.0.122              →  your-server.example.com
# 文件按内容动态扫描，未来新增含内部地址的文件也会被覆盖。
#
# 前提：GitLab CI/CD 变量 GITHUB_PUSH_TOKEN（GitHub PAT，需对
#       botler 仓库有写权限，建议勾选 Masked + Protected）。
#       未配置时本 job 跳过（exit 0），不影响主流水线。
# ================================================================
sync_to_github:
  stage: sync
  tags:
    - linux
    - code01
  variables:
    # 本 job 用完整克隆（CI_REPOSITORY_URL）重新检出，不需要 runner 的 checkout
    GIT_STRATEGY: none
  # 仅 main 分支的 push 流水线触发；同步 commit 带 [skip ci]，
  # 不触发流水线，不会造成同步循环
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      set -e
      echo "=== GitHub 镜像同步（CodeFuckee/botler：剔除 .gitlab-ci.yml + 脱敏）==="

      # ⚠️ code01 上存在全局代理环境变量（会干扰外网直连），
      # 与 deploy_to_code01 一致：先清理代理再走外网
      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
      export NO_PROXY="localhost,127.0.0.1,::1"
      export no_proxy="$NO_PROXY"

      # 未配置 token 时跳过（不影响主流水线）：
      # 配置位置：Settings > CI/CD > Variables，键名 GITHUB_PUSH_TOKEN，
      # 值用 GitHub PAT（repo 写权限），勾选 Masked + Protected
      if [ -z "${GITHUB_PUSH_TOKEN:-}" ]; then
        echo "⚠️ 未配置 GITHUB_PUSH_TOKEN，跳过 GitHub 同步"
        echo "   配置方法：GitLab 项目 Settings > CI/CD > Variables 添加"
        echo "   GITHUB_PUSH_TOKEN = <GitHub PAT>（勾选 Masked + Protected）"
        exit 0
      fi

      # 完整克隆当前仓库（CI_JOB_TOKEN 只读权限即可），检出本次提交
      # （不用浅克隆：force push 浅历史会导致 GitHub 侧提交链断裂）
      SYNC_DIR="/tmp/sync-github-botler"
      rm -rf "${SYNC_DIR}"
      git clone --quiet "${CI_REPOSITORY_URL}" "${SYNC_DIR}"
      cd "${SYNC_DIR}"
      git checkout --quiet "${CI_COMMIT_SHA}"
      echo "✓ 已检出提交 ${CI_COMMIT_SHA}"

      # 剔除 .gitlab-ci.yml（GitHub 镜像不需要 GitLab 专有配置）
      git rm --quiet .gitlab-ci.yml

      # ----------------------------------------------------------
      # 脱敏：内部地址替换为示例占位符（RFC 2606 保留域名，不指向
      # 真实主机）。扫描对象 = git 跟踪的全部文本文件（git rm
      # .gitlab-ci.yml 后已不含 CI 文件；node_modules 等未跟踪
      # 目录天然排除），不受扩展名限制，未来新增文件含内部
      # 地址也会被覆盖。
      # ----------------------------------------------------------
      SENSITIVE_FILES=$(git ls-files -z | xargs -0 grep -lI \
        'home\.chenkaidi\.top:509\|10\.0\.0\.122' 2>/dev/null || true)
      if [ -n "${SENSITIVE_FILES}" ]; then
        for f in ${SENSITIVE_FILES}; do
          sed -i 's|home\.chenkaidi\.top:509|gitlab.example.com|g; s|10\.0\.0\.122|your-server.example.com|g' "$f"
          echo "🔒 已脱敏: ${f}"
        done
      else
        echo "✓ 无需脱敏（未发现内部地址）"
      fi

      git config user.name "CI Bot"
      git config user.email "ci-bot@botler.local"
      git commit --quiet -am "chore: GitHub 镜像——剔除 .gitlab-ci.yml 并脱敏内部信息 [skip ci]"

      # force push 到 GitHub main（镜像历史由本 job 全权维护）。
      # -q 抑制成功输出（push URL 不落日志；token 若配置 Masked，
      # GitLab 自动将变量值打码为 [FILTERED]）
      # detached HEAD 下 push 必须用完整 refspec（refs/heads/main），
      # 否则空仓库首次推送时 git 无法推断 main 是分支还是 tag
      # 失败自动重试：最多 10 次、间隔 10 秒，规避网络抖动/代理波动
      # 等暂时性故障
      # ⚠️ timeout 60 必须：git 自身无连接超时，github.com 直连被阻断时
      # 单次 push 会挂数分钟，10 次循环会演变成无限挂起（2026-08-11
      # issue #6 流水线实测卡死 20+ 分钟）；加 60s 超时后单次尝试快速
      # 失败进入下一次重试，10 次 ≈ 11 分钟必然收敛
      pushed=false
      for attempt in $(seq 1 10); do
        if timeout 60 git push --quiet --force \
          "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/CodeFuckee/botler.git" \
          HEAD:refs/heads/main; then
          pushed=true
          break
        fi
        echo "⚠️ 第 ${attempt} 次推送失败，10 秒后重试（${attempt}/10）"
        echo "   （若提示 Repository not found：请先在 GitHub 创建空的 CodeFuckee/botler 仓库）"
        [ "$attempt" -lt 10 ] && sleep 10
      done
      if [ "$pushed" != "true" ]; then
        echo "❌ 连续 10 次推送 GitHub 失败，放弃同步"
        exit 1
      fi
      echo "✓ 已同步到 https://github.com/CodeFuckee/botler（main 分支）"
      echo "  （如需 GitHub Actions CI，可仿 Shipyard 添加 .github/workflows/ 并用 workflow_dispatch 触发）"
