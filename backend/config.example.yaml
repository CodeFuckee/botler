# Botler 配置文件（唯一事实来源，Web UI 是编辑它的外壳）
# 复制为 config.yaml 并填写。凭据用 ${ENV_VAR} 引用 .env 中的环境变量，不落明文。

gitlab:
  url: https://gitlab.example.com
  bot_token: ${GITLAB_BOT_TOKEN}      # bot 账号 PAT，scope 至少 api + write_repository
  # owner_token（issue #87，可选）：专用于编辑 issue（评论/标签）的 PAT。
  # issue #130：该 token 已在系统架构层隔离——所有 Agent 均不可使用
  # （agent 会话环境绝不注入，agent 只能用自己仓库的认证 token 编辑
  # issue）；只允许在概览页面编辑 issue、添加 issue、关闭 issue、添加
  # 评论与回复评论时由平台使用，严禁用于推送代码/操作流水线。
  # 推荐用仓库 Reporter 角色的低权限账号申请（账号层面杜绝推送代码/
  # 操作流水线），教程见 docs/GitLab-Owner-Token-申请教程.md。
  # 留空 = 未配置：概览页 issue 编辑（关闭/标签/评论/回复/添加）会被拦截
  # 并提示先配置（issue #132：不得静默回退 bot token 以 code01 身份发布）。
  # 也可用 ${ENV} 引用：owner_token: ${GITLAB_OWNER_TOKEN}
  webhook_secret: ${WEBHOOK_SECRET}   # webhook 校验 secret（任意随机串）
  bot_username: ""                    # 可选：bot 账号用户名（不填则自动识别）
  verify_ssl: false                   # 自建 GitLab 若为自签证书设 false

worker:
  max_concurrent_repos: 3             # 跨仓库并行上限
  # 执行引擎不设时限；任务会持续运行，直到完成或由人工停止（issue #424）
  max_retries: 2                      # 失败重试次数（"无法解决"不重试）
  reconcile_interval_seconds: 300     # 对账兜底扫描间隔
  # GitLab API 全局匀速上限（所有 webhook、定时及手动对账共用，建议不高于 10）
  gitlab_api_requests_per_second: 10
  # 全量对账时相邻启用仓库的随机抖动范围（秒）；单仓库手动对账不等待
  reconcile_jitter_min_seconds: 0.5
  reconcile_jitter_max_seconds: 2.0
  issue_priority: ["bug", "test", "feature"]
                                      # issue 标签处理优先级（issue #76）：
                                      #   同仓库队列内按此顺序派发，越靠前越先
                                      #   处理；未列出的标签排在最后，同优先级
                                      #   按 issue 更新时间升序。设置页
                                      #   「任务调度」卡片可修改
  engine: claude                      # 任务执行引擎（插件体系，issue #140）：
                                      #   claude（Claude Code CLI，默认）/
                                      #   hermes（hermes-agent SDK，经
                                      #   hermes_sdk_runner.py 进程内调用，
                                      #   issue #171）/ dsh
                                      #   （deepseek-harness SDK，经 dsh_runner.py
                                      #   进程内调用，issue #84）。引擎名对应执行
                                      #   引擎插件（botler.plugins.executors），
                                      #   未注册的引擎名回退 claude
  # 备用引擎降级（issue #236）：主引擎健康探测不可用或连续
  # fallback_after_failures 次「引擎类」失败（命令缺失 / API key 无效 /
  # SDK 错误）时，按此顺序自动降级到备用引擎重试任务，并在任务记录与
  # issue 评论注明「引擎 X 不可用，已降级 Y 执行」；空列表 = 不降级
  # （保持旧行为）。每次任务开始前做轻量健康探测：claude 检查
  # `claude --version`、hermes 检查 runner 可加载（run_agent 模块）、
  # dsh 检查 SDK 导入（deepseek_harness 模块）；引擎恢复后下一任务自动
  # 回到主引擎。设置页「任务调度」卡片可编辑。
  # fallback_engines: ["dsh", "hermes"]
  # fallback_after_failures: 2   # 连续引擎类失败降级阈值（正整数，默认 2）
  # 定时暂停窗口（issue #169）：窗口内停止开始新任务，已经开始执行的任务
  # 可以继续执行，未开始执行的任务等到窗口结束后自动开始执行。设置页
  # 「任务调度」卡片可编辑（空数组 = 不启用，默认关闭）：
  #   pause_windows: ["09:00-12:00", "14:00-18:00"]
  #     # 暂停窗口列表，每项 "HH:MM-HH:MM"（24 小时制，支持跨天如 22:00-02:00）
  #   pause_weekdays: [0, 1, 2, 3, 4]
  #     # 窗口生效星期（0=周一 … 6=周日），空 = 每天都生效
  #   pause_timezone: "Asia/Shanghai"
  #     # 判断窗口所用时区（IANA 名），空 = 服务器本地时区
  #   pause_priority_threshold: 0
  #     # 暂停窗口豁免优先级阈值（issue #299）：仓库调度优先级（repos[].priority，
  #     # 1~999，数字越小越优先）不差于该值（priority <= 阈值）的仓库，在暂停
  #     # 窗口内仍可开始新任务（不受暂停窗口影响）；0 = 关闭（所有仓库都受
  #     # 暂停窗口约束，issue #169 行为不变）
  # 任务执行前预检（issue #238）：领取任务后、消耗模型调用前对环境做快速
  # 检查（git 凭据/token 有效性、local_path 可写、磁盘剩余空间、工作区
  # 可用），环境性失败直接判任务失败（不重试、不消耗模型调用），检查明细
  # 在任务详情页「元信息」区展示（✓/✗）。
  precheck_enabled: true              # 预检总开关（默认开启；预检通过的任务
                                      # 行为与现状完全一致）
  precheck_disk_min_free_mb: 2048     # 磁盘剩余空间阈值（MiB，默认 2048 = 2GB），
                                      # 低于该值任务不开始
  # plugin_paths: []                  # 可选：外部插件加载（issue #140）——Python
                                      #   模块路径列表，应用启动时逐个加载并注册进
                                      #   插件体系（新增执行引擎 / 大模型供应商 /
                                      #   消息发送通道）。模块内调用
                                      #   botler.plugins.register_plugin 完成登记；
                                      #   加载失败仅记日志告警，不阻塞应用启动。
                                      #   示例：
                                      #   - /opt/botler-plugins/my_engine.py
                                      #   - /opt/botler-plugins/feishu_channel.py

claude:
  command: claude
  # stream-json 逐行实时输出（实时输出功能）：任务页面逐事件查看执行
  # 过程（thinking/文本/工具调用/结果）；claude 2.1.x 要求 stream-json
  # 配 --verbose，缺失时 executor 自动补齐
  args: ["-p", "--output-format", "stream-json", "--verbose"]
  # Claude Code 认证继承自服务器环境变量（见 .env.example 注释）

hermes: {}
  # hermes 引擎（worker.engine: hermes 时生效，issue #171 起为
  # hermes agent SDK 进程内集成）：hermes-agent 以源码 editable 安装进
  # botler 自身 venv（pm2 部署经 deploy/install-hermes-agent.sh 自动
  # 安装；Docker 部署由 docker-entrypoint.sh 在容器启动时对挂载源码
  # 安装），进程内调用 run_agent.AIAgent（对齐 dsh 引擎的 SDK 方式）。
  # LLM 配置仍在 hermes 侧 ~/.hermes 已配好，botler 不管理、无配置项。
  # 部署细节见 docs/hermes-engine-deployment.md。

dsh:
  # dsh 引擎（worker.engine: dsh 时生效，issue #84）：deepseek-harness
  # Python SDK（deepseek-harness-sdk==0.1.0rc6，可选依赖，botler venv 内
  # 安装）运行参数。DeepSeek API Key 走部署机环境变量 DEEPSEEK_API_KEY
  # （或 base_url/api_key 显式配置），与 hermes 同模式（botler 不管理）。
  # 部署细节见 docs/dsh-engine-deployment.md。
  provider: deepseek-official         # provider 路由（SDK 默认组合注册）
  model: deepseek-v4-flash            # 模型 id
  max_tokens: null                    # 可选：单请求输出 token 上限（null=provider 默认）
  reasoning_effort: ""                # 可选：推理等级（off / high / max，issue #123）；
                                      #   空 = 不设置（SDK 默认 high），设置页可选
  session_root: ""                    # 可选：会话持久化目录（断点续跑数据）；
                                      #   留空 = SDK 默认（环境变量 DSH_SESSION_ROOT）
  cordis: ""                          # 可选：自定义 Cordis 配置路径
  runtime_bin: ""                     # 可选：自定义 runtime 二进制路径
  base_url: ""                        # 可选：DeepSeek 兼容端点（默认环境 DEEPSEEK_BASE_URL）
  api_key: ""                         # 可选：默认环境 DEEPSEEK_API_KEY；支持 ${ENV} 引用

templates:
  default: |
    你是 {repo_name} 仓库的 AI 维护者。请处理以下指派给你的 issue：

    标题: {issue_title}
    正文: {issue_body}
    链接: {issue_url}

    工作要求：
    1. 在本地工作区（平台已自动切到仓库默认主分支并拉取最新代码，分支名
       可能是 main / master 等，不要假设分支名）分析问题，定位根因
    2. 编写修复代码并自测通过（运行相关测试/构建验证）
    3. 自测通过后，直接推送到当前分支（平台已自动切到仓库默认主分支，
       可能是 main / master 等，不要假设分支名）：
       git add -A && git commit -m "fix: 解决（issue #{issue_iid}）" && git push origin HEAD
    4. 推送成功后，在 issue 上留结果评论（平台会自动打 bot-done 标签）；
       不要关闭该 issue——关闭动作留给用户确认后手动执行（模版库规范）
    5. 提交信息严禁 `fix: #N` / `fixes #N` / `closes #N` / `resolves #N` 等
       「关闭关键词 + #编号」写法：GitLab 实例开启了 autoclose 机制，命中
       默认关闭模式会在推送后自动关闭 issue（用户侧表现为「agent 自己
       close issue」）；issue 引用一律写全角括号 `（issue #N）` 形式。
    6. 若确实无法解决，不要推送代码，如实汇报失败原因和已做的尝试

    GitLab API 认证约定（issue #403：任务 #585 因误判认证失效而终止）：
    - 认证验证以实际 API 调用为准：优先执行 `glab api user`（平台已配置
      GITLAB_HOST 与 glab 有效 token）；或从 `git remote get-url origin`
      内嵌凭据解析 token，用 `curl -k -H "PRIVATE-TOKEN: <token>" "{gitlab_url}/api/v4/user"` 验证。
    - 注意：`glab auth status` 对 4 段式新格式 PAT（>26 字符）会误报
      "Invalid token provided"（glab 1.36 缺陷），不能据此判定认证失效；
      环境变量 `GITLAB_TOKEN` 在 dsh 引擎的 bash 工具中可能不可见（运行时
      按安全策略过滤 *TOKEN* 环境变量名），不要依赖它。
    - 仅当实际 API 调用返回 401/403 且确认为凭据问题时，才按「认证失效即
      终止」处理并如实汇报；不得因验证方法误报而直接终止任务。

    注意：只修改与 issue 相关的代码，不要顺手重构无关部分。
  # 中断恢复模版（issue #116）：平台重启/中断后恢复会话的引导语
  # （claude/hermes/dsh 三引擎通用），支持与 default 相同的全部占位符。
  # 可选：不配置/留空 = 使用内置默认（Web UI 模版页可编辑，留空保存即恢复内置默认）。
  resume: ""
  # 结果评论模版（issue #252）：任务收尾时在 issue 上留的结构化执行报告
  # 评论（改动文件表格 / 测试摘要 / commit 链接 / 用时）。占位符见
  # templates.PLACEHOLDERS（diff_stat/test_summary/commit_link/duration 等，
  # 仅评论模版生效）；渲染后为空的段落自动隐藏（无改动/无测试数据不报错）。
  # 可选：不配置/留空 = 使用内置默认（Web UI 模版页可编辑，留空保存即恢复内置默认）。
  comment: ""
  # issue #223：原始 issue 正文是否注入提示词。true（默认）= 原样注入；
  # false = 正文不进 prompt，{issue_body} 渲染为指向 issue 链接的提示
  # （防 prompt injection，高风险场景可只给 URL）；{issue_body_urlenc}
  # 仍可用（URL 编码形式安全，模型需要时 URL 解码还原）。
  raw_body_in_prompt: true
  # issue #223：issue 正文注入提示词的最大字符数。超长截断并在末尾追加
  # 「[描述已截断，共 N 字，完整见 issue_url]」标记（agent 知道描述被截断，
  # 需要全文时经 issue_url 查看）；0 = 不截断（默认 8000）。
  body_max_chars: 8000

# 任务失败原因自动分类（issue #274）：任务收尾时对失败原因做规则分类
# （正则/关键字匹配错误信息），结果落库 tasks.failure_category，任务详情页
# 展示分类徽章 + 处理建议，失败评论带分类前缀，统计看板按分类聚合失败原因
# Top 分布。分类：
#   env         环境类：网络/认证/超时/磁盘（如 token 失效、连接失败）
#   engine      引擎类：命令缺失/SDK 错误/API key 无效
#   unsolvable  无法解决类：agent 明确报告无法解决/自测未过
#   unknown     兜底：未命中任何规则（分类错误不报错）
# rules（可选）：整体覆盖内置默认规则（不配置 = 使用代码常量
# botler/failure_classify.DEFAULT_RULES，同样可扩展）。键为分类名
# （env/engine/unsolvable，unknown 为兜底不允许配置），值为正则字符串
# 列表（re.IGNORECASE 匹配）；非法分类/非法正则被忽略，不影响任务收尾。
failure_classify:
  rules: {}
  # rules:
  #   env: ['custom-network-marker', 'custom-token-error']
  #   engine: ['custom-cli-missing']
  #   unsolvable: ['custom-unresolvable-marker']

browse:
  # 目录选择对话框的初始定位目录（"添加仓库 → 本地文件夹 → 浏览…"）。
  # 留空（推荐）= 服务器用户主目录（~）；支持 ~ 展开与相对路径。
  # 配置的路径不存在时自动回退主目录，不会导致对话框打不开。
  default_path: ""

# 生图模型（issue #135）：设置页「生图模型」卡片增删改查的图像模型列表
# （为后续 AI 功能消费做准备）。每项 {name, provider, base_url, api_key,
# model, enabled}；api_key 落盘 config.yaml（支持 ${ENV} 引用，与
# ai_providers 同模式）。内置预设：gemini_nano_banana（Gemini Nano
# Banana Pro，默认模型 gemini-3-pro-image）/ openai_gpt_image（GPT
# Image 2，默认模型 gpt-image-2），设置页选择预设自动填充默认
# base_url 与 model（均可修改）。base_url 语义：留空 / 等于预设默认 → 按官方
# 接口拼接操作路径；自定义（不等于预设默认）→ 视为完整请求地址直接使用，
# 不再拼接（如代理网关 https://grsai.dakka.com.cn/v1/draw/completions）。
# 后端 image_models.py 提供统一调用接口（ImageModelClient.generate）。
# image_models:
#   - name: Gemini 生产环境
#     provider: gemini_nano_banana
#     base_url: https://generativelanguage.googleapis.com/v1beta
#     api_key: ${GEMINI_IMAGE_API_KEY}
#     model: gemini-3-pro-image
#     enabled: true

# 识图模型（issue #152）：设置页「识图模型」卡片增删改查的视觉理解模型列表，
# 可配置具有视觉理解的模型，并有测试按钮——上传一张图片后调用模型描述图片。
# 每项 {name, provider, base_url, api_key, model, enabled}；api_key 落盘
# config.yaml（支持 ${ENV} 引用，与 image_models 同模式）。内置预设：
# gemini_vision（Gemini 视觉，默认模型 gemini-2.5-flash，generateContent
# 接口）/ openai_vision（OpenAI 视觉，默认模型 gpt-4o，chat/completions
# 接口）/ custom（自定义 OpenAI 兼容视觉模型，chat/completions 接口，需自填
# Base URL / 模型 / API Key），设置页选择预设自动填充默认 base_url 与 model
# （均可修改）。base_url 语义：留空 / 等于预设默认 → 按官方接口拼接操作路径
# （/chat/completions、:generateContent）；自定义（不等于预设默认）→ 视为
# 完整请求地址直接使用，不再拼接（如 https://api.example.com/v1/chat/completions）。
# issue #321：OpenAI 兼容识图供应商（openai_vision / custom）的自定义
# base_url 未以 /chat/completions 结尾时后端自动补拼（如
# https://.../compatible-mode/v1 → 实际请求 .../compatible-mode/v1/chat/completions），
# 只填 API 前缀即可正常调用，无需手动拼全路径。
# 后端 vision_models.py 提供统一调用接口（VisionModelClient.describe）。
# vision_models:
#   - name: Gemini 视觉生产环境
#     provider: gemini_vision
#     base_url: https://generativelanguage.googleapis.com/v1beta
#     api_key: ${GEMINI_VISION_API_KEY}
#     model: gemini-2.5-flash
#     enabled: true

# MinIO 对象存储（issue #163）：识图模型调用时，用户上传的图片先计算
# SHA-256 哈希、以哈希值为对象名上传 MinIO（同内容图片自动去重复用），
# 识图请求传 http(s) URL（OpenAI 兼容 image_url），替代直接把 base64
# 塞进请求体的做法（图片 base64 可达数十万字符，网关/模型对请求体大小
# 敏感；阿里云百炼等兼容网关会直接拒绝 data: URL，issue #164）。
# ⚠️ 自 issue #164 起：OpenAI 兼容识图模型（openai_vision / custom）
# 禁止 base64 内联——未启用 / 配置不完整时识图测试会明确报错引导启用
# MinIO（不再静默回退 base64）；仅 Gemini 官方 generateContent 接口
# 不支持任意 http URL 图片输入（Google API 限制，只接受 base64
# inline_data），保持 base64 内联输入。
# 部署要求（issue #164）：
#   - 桶默认名 public，不存在自动创建；桶权限自动设为「公开只读」
#     （匿名 s3:GetObject），识图模型（含外部公网网关）可匿名取图；
#   - public_base_url 填 https://<站点>/minio-public 即可——后端已内置
#     /minio-public/ 访问端点（issue #319，FastAPI 直接流式返回 MinIO
#     图片桶对象，见 botler/minio_public.py），无需再配 nginx location；
#     大流量分流场景可另配 nginx 代理（deploy/nginx-minio-public.conf），
#     无需暴露 9000 端口。
# endpoint / 凭据可经 ${ENV} 引用（与部署写入 data/backend/.env 的
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 同源），识图模型必须能访问
# public_base_url（自建网关走内网地址；外部模型供应商需公网可达）。
# minio:（设置页「MinIO 对象存储」卡片可配置，issue #170；本段为 config.yaml
#   手写等价物——endpoint / access_key / secret_key / public_base_url 等字段
#   与卡片一一对应，凭据掩码显示、留空保持现有）
# minio:
#   enabled: true                    # 识图图片上传开关；启用且配置完整后，数据
#                                    #   备份/恢复一并覆盖图片桶（issue #205）
#   endpoint: "127.0.0.1:9000"       # MinIO API 地址（host:port）
#   secure: false                    # endpoint 是否 https
#   access_key: ${MINIO_ROOT_USER}   # 访问凭据（留空回退环境变量）
#   secret_key: ${MINIO_ROOT_PASSWORD}
#   bucket: public                   # 图片对象桶（默认 public，不存在
#                                    #   自动创建并设为公开只读）
#   public_base_url: ""              # 识图模型取图的 http(s) 前缀（建议
#                                    #   nginx 代理 MinIO 桶的地址），
#                                    #   对象 URL =
#                                    #   public_base_url/bucket/<sha256 哈希>
#   verify_ssl: true                 # endpoint 证书校验（自签证书设 false）

backup:
  # 备份与恢复（config.yaml + botler.db → <数据目录>/backups/botler-backup-*.tar.gz）
  enabled: true            # 定时备份开关（每天 03:00 Asia/Shanghai 自动备份）
  retention_days: 30       # 保留策略：只保留最近 N 天的备份（清理更旧的）

retention:
  # 运行数据保留（issue #204）：终态任务摘要始终保留，只删除明细和日志文件。
  enabled: true
  task_logs_days: 90             # succeeded / failed 等终态任务的 task_logs 明细保留天数
  notification_events_days: 30   # 前端游标通知事件保留天数
  log_files_days: 90             # task_<id>.log 执行日志文件保留天数
  pm2_max_log_size_mb: 10        # pm2-*.log 超过此大小时压缩归档并截断活动文件
  # 每天 04:00 Asia/Shanghai 自动清理；也可在设置页点击「立即清理」。

ui:
  # 界面显示（issue #142）：灵感板块 / CI/CD 流水线板块是否显示未启用项目。
  # true = 显示（未启用仓库带「未启用」徽章，默认）；false = 两个板块只展示
  # 已启用仓库（后端接口直接过滤，未启用仓库不再发起 GitLab 流水线查询）。
  # 设置页「界面显示」卡片可修改，保存后立即生效。
  show_disabled_repos: true
  # 界面显示主题三态（issue #217）：system（跟随系统 prefers-color-scheme，
  # 默认）/ light（强制浅色）/ dark（强制深色，深色底 #1a1d23 + 蓝色强调）。
  # 设置页「界面显示」卡片可修改；前端同时把偏好写入 localStorage（botler.theme）
  # 实现首屏防闪烁与跨设备同步。
  theme: system

notifications:
  # 网页通知（issue #21）：浏览器 Notification API 弹系统通知，时机可在设置页配置。
  # 前端按开关过滤，改设置立即生效无需重启；需浏览器授权且页面保持打开。
  enabled: true                     # 总开关
  task_needs_interaction: true      # 任务需要交互（任务失败，需人工介入）
  issue_completed: true             # issue 完成（任务成功，issue 已关闭）
  queue_empty: true                 # issue 列表为空（无待处理 issue）
  queue_no_work: true               # 无 issue 可处理（有 issue 但均在处理中）

webhook:
  # Webhook 消息推送（issue #136）：任务完成（成功收尾）时调用 webhook
  # 进行消息推送，配置可在设置页修改（「消息推送 Webhook」卡片）。
  enabled: false                    # 总开关
  url: ""                           # webhook 地址（POST 目标，须 http(s):// 开头）
  content_type: application/json    # Content-Type 请求头
  authorization: ""                 # Authorization 请求头（可选，如 Bearer xxxxx；
                                    #   支持 ${ENV} 引用，如 ${WEBHOOK_AUTH}）
  body_template: ""                 # POST 结构体模板，可使用全局模板占位符
                                    #   （{repo_name}/{issue_title}/{issue_body}/
                                    #   {issue_url}/{gitlab_url}/{project_id}/
                                    #   {issue_iid}/{project_path}/
                                    #   {project_path_encoded}/{gitlab_host}），
                                    #   请求时自动填充；留空 = 内置默认 JSON 模板

auto_issue:
  # 任务失败自动创建 GitLab issue 上报（issue #347）：任务失败收尾时自动
  # 在任务所属项目创建失败上报 issue——标题写明失败任务 id，正文含失败原因 /
  # 失败分类 / 处理建议 / 原始 issue 链接，标签 bug + bot-failed（bot-failed
  # 防止对账调度器把上报 issue 重新领取形成死循环），负责人按 assignee 指定。
  # 配置可在设置页修改（「任务失败自动上报」卡片）。
  enabled: true                     # 总开关（关闭 = 失败时不再自动上报）
  assignee: agent                   # 上报 issue 负责人用户名（GitLab 用户名，
                                    #   如 agent；留空 = 内置默认 agent，解析
                                    #   失败时不指定负责人，不阻塞上报）

alerts:
  # 聚合告警（issue #229）：平台无人值守时主动通知异常——任务失败率过高 /
  # 队列堆积无进度 / GitLab token 失效 / 磁盘空间不足，替代「用户打开页面
  # 才发现」。检测并入对账循环（reconciler 定时扫描，默认 5 分钟一轮），
  # 告警经现有通知通道分发：网页通知 in_app 事件（前端轮询弹系统通知，
  # 受 notifications.enabled 总开关控制）+ webhook 推送（受 webhook.enabled
  # 控制）。设置页「聚合告警」卡片可配置全部阈值。本段全部可缺省。
  enabled: true                     # 聚合告警总开关（关闭 = 全部告警不检测不通知）
  notify_failure_rate: true         # 近 1 小时任务失败率告警开关
  failure_rate_threshold: 50        # 失败率阈值（百分比 0~100，如 50 = 50%）
  failure_rate_window: 3600         # 失败率统计窗口（秒，默认 1 小时）
  notify_queue_backlog: true        # 队列堆积告警开关
  queue_backlog_threshold: 5        # 队列积压条数阈值（活跃任务数）
  queue_stall_minutes: 30           # 无进度判定窗口（分钟，窗口内无任务收尾 = 无进度）
  notify_token_invalid: true        # GitLab token 失效（401/403）告警开关
  notify_disk_low: true             # 磁盘空间告警开关
  disk_min_free_mb: 512             # 磁盘剩余阈值（MiB，与 /api/health 探测同口径）
  throttle_seconds: 3600            # 同类告警节流窗口（秒，默认 1 小时）

usage:
  # 任务 token 用量与费用（issue #235）：任务执行时采集三引擎（claude /
  # hermes / dsh）的模型调用 token 用量，任务详情页展示用量卡片、概览页
  # 按仓库/引擎/时间段聚合统计。本段全部可缺省：
  #   currency：估算费用货币（默认 USD）；
  #   pricing：模型单价表（每百万 token 单价）。配置后按「prompt × 输入
  #   单价 + completion × 输出单价」估算费用；无单价时任务详情只展示
  #   token 数、不估算费用。model 支持子串匹配（如 deepseek 可匹配
  #   deepseek-v4-flash），精确匹配优先；引擎自带费用（claude 的
  #   total_cost_usd / hermes 的 session_estimated_cost_usd）优先于本表。
  currency: USD
  pricing:
    - model: deepseek-v4-flash
      input_per_million: 0.2        # 每百万输入 token 单价（USD）
      output_per_million: 0.8       # 每百万输出 token 单价（USD）
    - model: claude
      input_per_million: 3
      output_per_million: 15

sso:
  # Synology SSO 登录（issue #27）：OIDC 授权码模式接入群晖 SSO Server。
  # 启用后访问 Web UI 需用群晖账号登录（未启用时保持开放访问）；
  # 配置步骤见 docs/Synology-SSO-配置指南.md。
  enabled: false                    # 总开关：启用后强制登录
  well_known_url: ""                # 群晖 SSO Server 的 OIDC well-known URL
                                    #   （SSO Server → 服务 → OIDC → Well-known URL，
  #    形如 https://<群晖地址>:<端口>/.well-known/openid-configuration）
  client_id: ""                     # Application ID（SSO Server → 应用程序 → 编辑）
  client_secret: ""                 # Application Secret（同上，建议用 ${ENV} 引用）
  scope: "openid profile email"     # 授权范围
  session_days: 7                   # 登录有效期（天）
  redirect_uri: ""                  # 回调地址；留空 = 按浏览器访问地址自动生成
  verify_ssl: true                  # 群晖为自签名证书时设 false

# 仓库列表（在 Web UI 添加仓库时会自动写入这里）
# 仓库级任务参数覆盖（issue #237）：max_retries / engine
# 均为可选字段，留空 = 继承全局 worker 段对应配置（仓库编辑弹窗「任务参数」
# 分组可配置/清空；任务列表/详情展示实际生效值与来源——仓库覆盖 or 继承全局）
# repos:
#   - project_id: 123
#     name: botler
#     url: https://gitlab.example.com/group/botler.git
#     enabled: true
#     priority: 100
#     max_retries: 5              # 失败重试次数（0~20），留空继承全局
#     engine: dsh                 # 执行引擎（claude/hermes/dsh），留空继承全局
repos: []

# 仓库列表（在 Web UI 添加仓库时会自动写入这里）
repos: []
