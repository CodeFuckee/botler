# mypy 渐进式启用配置（issue #213）：后端此前无任何类型检查工具，
# 类型错误（dict key 拼错、None 未判）只能运行时暴露。
#
# 本轮先扫 botler/ 纯逻辑核心模块（gitlab_client / scheduler /
# database），错误清零后作为 CI 门禁；后续可逐步把范围扩大到整个
# botler/ 包并收紧规则（严格模式、完整注解等）。
[mypy]
python_version = 3.14

# 只查核心模块；依赖（executor/config/api 等）本轮不跟随检查，
# 避免一次性被历史类型债务淹没（executor 拆分见另一 issue）
files = botler/gitlab_client.py, botler/scheduler.py, botler/database.py

# 显式检查未注解函数体：dict key 拼错、None 未判等运行时才暴露的
# 类型错误在静态检查下即可发现（验收标准「mypy 对核心模块零错误」）
check_untyped_defs = True

# 核心模块之外的导入按 Any 处理（范围收敛，渐进式启用）
follow_imports = skip

no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
