# ================================================================
# nginx 代理 MinIO public 桶（识图模型图片访问，issue #164）
#
# 背景：识图模型调用时图片以 http URL 传入（不再 base64 内联），图片
# 对象存放在 MinIO 的 public 桶（桶不存在自动创建，权限自动设为公开
# 只读）。为避免把 MinIO 9000 端口暴露到公网，用 nginx 把
#   /minio-public/<对象名>  代理到  MinIO API /public/<对象名>
# 识图模型（含外部公网网关，如阿里云百炼 qwen）经 https 匿名取图。
#
# 对象 URL 形如:  https://<站点>/minio-public/<sha256 哈希>
# 后端配置:       minio.public_base_url = https://<站点>/minio-public
#                 （或环境变量 MINIO_PUBLIC_BASE_URL，见 .env.example）
#
# 接入方式（任选其一，按部署环境）:
#   1. 独立 nginx / 网关服务器：把本文件复制到 conf.d/ 并
#      nginx -s reload（注意按实际 MinIO 地址改 proxy_pass）；
#   2. 已有站点 server 块：把下方 location 段合并进对应 server；
#   3. 群晖 DSM 反向代理等可视化网关：新建一条「/minio-public →
#      127.0.0.1:9000/public」的转发规则，并开启 WebSocket/HTTP 透传
#      设置（本文件为该场景的等价 nginx 配置参考）。
# ================================================================

# location 可合并进站点 server 块（如 :509 反向代理站点的 server）
location /minio-public/ {
    # 代理到本机 MinIO API 的 public 桶（路径 /public/ 替换 /minio-public/ 前缀）
    proxy_pass http://127.0.0.1:9000/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # 图片对象匿名读：MinIO 桶已由后端自动设为公开只读（s3:GetObject）
    proxy_buffering off;
    add_header Cache-Control "public, max-age=86400";
}
