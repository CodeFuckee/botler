# ================================================================
# nginx 代理 MinIO public 桶（识图模型图片访问，issue #164）
#
# 背景：识图模型调用时图片以 http URL 传入（不再 base64 内联），图片
# 对象存放在 MinIO 的 public 桶（桶不存在自动创建，权限自动设为公开
# 只读）。为避免把 MinIO 9000 端口暴露到公网，用 nginx 把
#   /minio-public/<bucket>/<对象名>  代理到  MinIO API /<bucket>/<对象名>
# 识图模型（含外部公网网关，如阿里云百炼 qwen）经 https 匿名取图。
#
# ⚠️ issue #319 起本配置为「可选分流方案」：后端已内置 /minio-public/
# 访问端点（backend/botler/minio_public.py）——图片 URL 经站点反向代理
# 直通 FastAPI 即返回 MinIO 图片桶对象，不依赖本 nginx location（此前
# 必须把本 location 合并进站点 server 块，Synology DSM 等可视化反向
# 代理无法配置，未生效导致图片 URL 被 SPA 兜底吞掉返回 HTML、外部模型
# 网关报 url error）。仅当站点 nginx 可直连 MinIO 且需要分流大流量时
# 才合并本配置。
#
# 对象 URL 形如:  https://<站点>/minio-public/<bucket>/<sha256 哈希>
#                 例：https://home.chenkaidi.top:448/minio-public/public/<哈希>
# 后端配置:       minio.public_base_url = https://<站点>/minio-public
#                 minio.bucket = public（默认桶，见 config.example.yaml）
#                 （或环境变量 MINIO_PUBLIC_BASE_URL / MINIO_BUCKET，
#                   见 .env.example）
#
# ⚠️ 路径映射说明（issue #311 修复）：后端生成的图片对象 URL 已含桶名段
# （public_base_url/bucket/<哈希>），nginx 只需剥离 /minio-public/ 前缀、
# 把 /<bucket>/<哈希> 原样代理到 MinIO API（路径式 /bucket/object）。
# 因此 location 的 proxy_pass URI 必须是 /（前缀替换为空，见下方配置），
# 或等价地用 rewrite ^/minio-public/(.*)$ /$1 break; 剥离前缀——绝不能
# 写成 /public/：nginx 会用 /public/ 替换 /minio-public/ 前缀，把 URL 中
# 已有的 bucket 段重复拼接成 /public/public/<哈希>，MinIO 返回 404，
# 识图任务取图失败（issue #311 报错现象，本地 nginx 实测复现）。
#
# 接入方式（任选其一，按部署环境）:
#   1. 独立 nginx / 网关服务器：把本文件复制到 conf.d/ 并
#      nginx -s reload（注意按实际 MinIO 地址改 proxy_pass）；
#   2. 已有站点 server 块（如 :448 botler 平台 / :509 GitLab 的反向代理
#      server）：把下方 location 段合并进对应 server——务必确认目标站点
#      的 nginx 已加载该 location，否则 /minio-public/ 会被站点的 SPA
#      兜底（try_files → index.html）吞掉，表现为图片 URL 直接跳转到平台；
#   3. 群晖 DSM 反向代理等可视化网关：新建一条「/minio-public →
#      127.0.0.1:9000」的转发规则（完整路径透传，保留 /<bucket>/<key>），
#      并开启 WebSocket/HTTP 透传设置（本文件为该场景的等价 nginx 参考）。
#
# 验证：nginx -t && nginx -s reload 后，浏览器/curl 访问
#   https://<站点>/minio-public/public/<哈希>
# 应直接返回图片（Content-Type: image/*），而不是平台的 HTML 页面。
# ================================================================

# location 可合并进站点 server 块（如 :448 botler 平台反向代理的 server）
location /minio-public/ {
    # 只剥离 /minio-public/ 前缀：/minio-public/public/<哈希> → /public/<哈希>
    # （proxy_pass URI 为 / 即「前缀替换为空」；保留 URL 中已有的 bucket 段，
    #   勿写成 /public/ 导致 /public/public/<哈希> 404——issue #311）
    proxy_pass http://127.0.0.1:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # 图片对象匿名读：MinIO 桶已由后端自动设为公开只读（s3:GetObject）
    proxy_buffering off;
    add_header Cache-Control "public, max-age=86400";
}
