# Botler 统一入口参考配置（issue #183）：Nginx 统一代理主后端 + 独立终端服务进程
#
# 背景：Web 终端由「独立终端服务进程」（Tornado + terminado，默认只监听
# 127.0.0.1:8765）承载，安全隔离。默认部署（pm2 / docker compose）中，
# Botler 主后端已内置 /api/terminal/* 反向代理（开箱即用，无需 nginx）；
# 若已有 Nginx 作为统一入口，可参考本配置把 /terminal 直连终端服务进程。
#
# 用法（以本机 code01 为例，按实际端口/域名调整）：
#   sudo cp deploy/nginx-terminal.conf /etc/nginx/conf.d/botler.conf
#   sudo nginx -t && sudo nginx -s reload
# 注意：nginx 直连 /terminal 时，终端服务进程需可被 nginx 访问
# （pm2 默认 127.0.0.1:8765 即可；docker 形态需映射 8765 或同网桥）。

upstream botler_backend {
    server 127.0.0.1:8000;
}

upstream botler_terminal {
    # 终端服务进程（Tornado + terminado，仅本机监听，安全隔离）
    server 127.0.0.1:8765;
}

server {
    listen 8080;
    server_name _;

    # ---- Botler 主后端（FastAPI：API + 前端静态资源）----
    location / {
        proxy_pass http://botler_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 终端服务（WebSocket 升级代理，可选）----
    # 默认前端走 /api/terminal/ws（主后端反向代理）；此段用于 nginx
    # 统一入口形态把 /terminal 直连终端服务进程（省一次内部转发）。
    location /terminal/ {
        proxy_pass http://botler_terminal;
        proxy_http_version 1.1;
        # WebSocket 升级头（xterm.js 直连必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
